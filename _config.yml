title: Lorenz Wenzel
description: Dokumentation von GenAI Cloud Projekte
theme: minima

# Zeitzone, damit Beitragsdaten beim Build so interpretiert werden,
# wie sie geschrieben sind. Ohne das baut GitHub in UTC und schluckt
# Beitraege, deren Uhrzeit noch in der Zukunft liegt.
timezone: Europe/Berlin

minima:
  skin: classic
  date_format: "%d.%m.%Y"

# Nur diese Seite erscheint in der Kopfnavigation.
header_pages:
  - text2sql-agent-aws/index.md
  - rag-auf-vertraegen-in-azure/index.md

plugins:
  - jekyll-feed

# Englische Übersetzungen eines Beitrags liegen hier, mit demselben
# 'slug' wie das deutsche Original. output: false, weil sie keine
# eigene URL bekommen sollen — das Post-Layout blendet sie per JS
# in dieselbe Seite ein (Umschalter statt eigener Adresse).
#
# Die Dateien in _translations/ enden bewusst auf .txt, nicht .md:
# Jekyll rendert Collections in unklarer Reihenfolge, und bei .md
# würde Kramdown die Übersetzung manchmal vor, manchmal nach dem
# Post konvertieren. Mit .txt fasst Kramdown die Datei nie automatisch
# an — das Layout ruft stattdessen selbst `| markdownify` auf, was
# unabhängig von der Renderreihenfolge immer funktioniert.
collections:
  translations:
    output: false
