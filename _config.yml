title: Lorenz Wenzel
description: Notizen zum Bauen von LLM-Agenten auf AWS
theme: minima

# Zeitzone, damit Beitragsdaten beim Build so interpretiert werden,
# wie sie geschrieben sind. Ohne das baut GitHub in UTC und schluckt
# Beitraege, deren Uhrzeit noch in der Zukunft liegt.
