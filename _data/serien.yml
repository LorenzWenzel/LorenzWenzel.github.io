# titel/beschreibung sind deutsch, *_en die englische Fassung.
- titel: "text2SQL-Agent auf AWS"
  titel_en: "A text2SQL Agent on AWS"
  kategorie: text2sql-agent-aws
  url: /text2sql-agent-aws/
  beschreibung: >-
    Ein Agent, der natürlichsprachige Fragen in SQL übersetzt und gegen Amazon
    Athena ausführt — vom Rückgabeformat der Werkzeuge über die Herkunft des
    Domänenwissens bis zum Prompt Caching.
  beschreibung_en: >-
    An agent that turns natural-language questions into SQL and runs them against
