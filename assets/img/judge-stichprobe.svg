<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Wie viele Golden-Fragen braucht es</title><desc id="d">Liniendiagramm: nachweisbarer Unterschied in Prozentpunkten über die Anzahl Golden-Fragen, logarithmische Achse. Gepaart, also dieselben Fragen für beide Versionen: 18,2 Punkte bei 50 Fragen, 10,6 bei 100, 6,3 bei 200, 3,9 bei 400, 2,5 bei 800, 1,7 bei 1600. Ungepaart, also getrennte Fragen je Version: 22,4 bei 50, 15,8 bei 100, 11,2 bei 200, 7,9 bei 400, 5,6 bei 800, 4,0 bei 1600, 2,8 bei 3200. Drei Punkte sind gepaart ab etwa 600 Fragen nachweisbar, ungepaart erst ab etwa 2800 je Version.</desc><rect x="0" y="0" width="880" height="470" fill="#fcfcfb"/><text x="28.0" y="38.0" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Ab wann ist eine Verbesserung kein Rauschen?</text><text x="28.0" y="60.0" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Kleinster Unterschied in der Trefferquote, den ein Golden Set nachweisen kann (Trefferquote um 80 %, α = 0,05, Power 80 %).</text><rect x="28.0" y="86.0" width="12.0" height="12.0" rx="3" fill="#2a78d6"/><text x="46.0" y="96.0" font-size="11.5" fill="#56554f" font-weight="500" text-anchor="start">gepaart — dieselben Fragen, beide Versionen</text><rect x="330.0" y="86.0" width="12.0" height="12.0" rx="3" fill="#eb6834"/><text x="348.0" y="96.0" font-size="11.5" fill="#56554f" font-weight="500" text-anchor="start">ungepaart — getrennte Fragen je Version</text><line x1="92.0" y1="388.0" x2="780.0" y2="388.0" stroke="#e7e6e1" stroke-width="1"/><text x="82.0" y="392.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">0</text><line x1="92.0" y1="336.0" x2="780.0" y2="336.0" stroke="#e7e6e1" stroke-width="1"/><text x="82.0" y="340.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">5</text><line x1="92.0" y1="284.0" x2="780.0" y2="284.0" stroke="#e7e6e1" stroke-width="1"/><text x="82.0" y="288.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">10</text><line x1="92.0" y1="232.0" x2="780.0" y2="232.0" stroke="#e7e6e1" stroke-width="1"/><text x="82.0" y="236.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">15</text><line x1="92.0" y1="180.0" x2="780.0" y2="180.0" stroke="#e7e6e1" stroke-width="1"/><text x="82.0" y="184.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">20</text><line x1="92.0" y1="128.0" x2="780.0" y2="128.0" stroke="#e7e6e1" stroke-width="1"/><text x="82.0" y="132.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">25</text><text x="28.0" y="116.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">Prozentpunkte</text><text x="92.0" y="406.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">50</text><text x="206.7" y="406.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">100</text><text x="321.3" y="406.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">200</text><text x="436.0" y="406.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">400</text><text x="550.7" y="406.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">800</text><text x="665.3" y="406.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">1.600</text><text x="780.0" y="406.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">3.200</text><text x="436.0" y="428.0" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="middle">Anzahl Golden-Fragen (je Version)</text><line x1="92.0" y1="356.8" x2="780.0" y2="356.8" stroke="#56554f" stroke-width="1.2" stroke-dasharray="5 4"/><text x="98.0" y="371.8" font-size="10.5" fill="#56554f" font-weight="600" text-anchor="start">+3 Punkte</text><polyline points="92.0,155.0 206.7,223.7 321.3,271.5 436.0,305.8 550.7,329.8 665.3,346.4 780.0,358.9" fill="none" stroke="#eb6834" stroke-width="2"/><circle cx="92.0" cy="155.0" r="4.2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="206.7" cy="223.7" r="4.2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="321.3" cy="271.5" r="4.2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="436.0" cy="305.8" r="4.2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="550.7" cy="329.8" r="4.2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="665.3" cy="346.4" r="4.2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="780.0" cy="358.9" r="4.2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><polyline points="92.0,198.7 206.7,277.8 321.3,322.5 436.0,347.4 550.7,362.0 665.3,370.3" fill="none" stroke="#2a78d6" stroke-width="2"/><circle cx="92.0" cy="198.7" r="4.2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="206.7" cy="277.8" r="4.2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="321.3" cy="322.5" r="4.2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="436.0" cy="347.4" r="4.2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="550.7" cy="362.0" r="4.2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="665.3" cy="370.3" r="4.2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="206.7" y="213.7" font-size="10.5" fill="#a33a12" font-weight="600" text-anchor="middle">15,8</text><text x="206.7" y="295.8" font-size="10.5" fill="#1c5cab" font-weight="600" text-anchor="middle">10,6</text><text x="436.0" y="295.8" font-size="10.5" fill="#a33a12" font-weight="600" text-anchor="middle">7,9</text><text x="436.0" y="337.4" font-size="10.5" fill="#1c5cab" font-weight="600" text-anchor="middle">3,9</text><line x1="505.0" y1="356.8" x2="505.0" y2="388.0" stroke="#2a78d6" stroke-width="1.2" stroke-dasharray="2 3"/><circle cx="505.0" cy="356.8" r="4.5" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="505.0" y="344.8" font-size="10.5" fill="#56554f" font-weight="600" text-anchor="middle">≈ 600 Fragen</text><line x1="757.2" y1="356.8" x2="757.2" y2="388.0" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="2 3"/><circle cx="757.2" cy="356.8" r="4.5" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><text x="753.2" y="328.8" font-size="10.5" fill="#56554f" font-weight="600" text-anchor="end">≈ 2.800 je Version</text><line x1="28.0" y1="436.0" x2="852.0" y2="436.0" stroke="#e7e6e1" stroke-width="1"/><text x="28.0" y="456.0" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="start">Gepaart heißt: beide Versionen laufen über dieselben Fragen, gezählt werden nur die Fragen, die kippen (McNemar). Annahme: je 2 % kippen in beide Richtungen.</text></svg>