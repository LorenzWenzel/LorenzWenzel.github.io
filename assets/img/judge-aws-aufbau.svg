<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">LLM-as-a-Judge auf AWS mit eigener Agentenschleife</title><desc id="d">Links der Agent mit eigener Schleife (Strands, Converse und MCP) auf AgentCore Runtime oder Fargate, instrumentiert mit ADOT und OpenTelemetry-GenAI-Spans. Die Telemetrie landet in CloudWatch mit Transaction Search. AgentCore Evaluations liest daraus in zwei Bahnen: Online bewertet zehn Prozent der Produktionssessions ohne Referenz, Batch und Dataset bewerten vor jedem Release ein Golden Set mit Referenz, darunter ein Lambda, das das SQL auf Athena ausführt. Schlecht bewertete Sessions gehen an einen Menschen und werden zu neuen Golden-Fragen.</desc><rect x="0" y="0" width="880" height="600" fill="#fcfcfb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56554f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1baf7a"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#82807a"/></marker></defs><text x="28.0" y="38.0" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">LLM-as-a-Judge auf AWS — mit eigener Schleife</text><text x="28.0" y="60.0" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">AgentCore Evaluations bewertet Traces, nicht den Harness. Die eigene Schleife mit Converse und MCP muss nur sauber instrumentiert sein.</text><rect x="28.0" y="108.0" width="200.0" height="112.0" rx="5" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.2"/><text x="40.0" y="128.0" font-size="9.5" fill="#1c5cab" font-weight="600" text-anchor="start">AGENT</text><text x="40.0" y="148.0" font-size="11.5" fill="#17171a" font-weight="500" text-anchor="start">Eigene Schleife (Strands)</text><text x="40.0" y="165.0" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">Converse + MCP</text><text x="40.0" y="182.0" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">AgentCore Runtime</text><text x="40.0" y="199.0" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">oder Fargate / EKS</text><line x1="128.0" y1="222.0" x2="128.0" y2="248.0" stroke="#56554f" stroke-width="1.6" marker-end="url(#a)"/><rect x="28.0" y="250.0" width="200.0" height="78.0" rx="5" fill="#ffffff" stroke="#dcdbd6" stroke-width="1.2"/><text x="40.0" y="270.0" font-size="9.5" fill="#82807a" font-weight="600" text-anchor="start">ADOT / OPENTELEMETRY</text><text x="40.0" y="290.0" font-size="10.5" fill="#17171a" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">gen_ai.operation.name =</text><text x="40.0" y="306.0" font-size="10.5" fill="#17171a" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">invoke_agent · chat ·</text><text x="40.0" y="320.0" font-size="10.5" fill="#17171a" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">execute_tool</text><line x1="128.0" y1="330.0" x2="128.0" y2="356.0" stroke="#56554f" stroke-width="1.6" marker-end="url(#a)"/><rect x="28.0" y="358.0" width="200.0" height="70.0" rx="5" fill="#ffffff" stroke="#dcdbd6" stroke-width="1.2"/><text x="40.0" y="378.0" font-size="9.5" fill="#82807a" font-weight="600" text-anchor="start">AMAZON CLOUDWATCH</text><text x="40.0" y="398.0" font-size="11.5" fill="#17171a" font-weight="500" text-anchor="start">Transaction Search</text><text x="40.0" y="415.0" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="start">Log-Gruppe des Agenten</text><rect x="262.0" y="100.0" width="590.0" height="410.0" rx="8" fill="#ffffff" stroke="#e7e6e1" stroke-width="1"/><text x="276.0" y="122.0" font-size="9.5" fill="#82807a" font-weight="600" text-anchor="start">AMAZON BEDROCK AGENTCORE EVALUATIONS</text><path d="M 230 393 L 246 393 L 246 210 L 272 210" fill="none" stroke="#56554f" stroke-width="1.6" marker-end="url(#a)"/><path d="M 246 393 L 246 385 M 246 393 L 246 400 L 272 400" fill="none" stroke="#56554f" stroke-width="1.6" marker-end="url(#a)"/><rect x="274.0" y="134.0" width="566.0" height="158.0" rx="6" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.3"/><text x="288.0" y="156.0" font-size="12.5" fill="#1c5cab" font-weight="600" text-anchor="start">Online — Produktion</text><text x="288.0" y="174.0" font-size="10.8" fill="#56554f" font-weight="400" text-anchor="start">10 % der Sessions, ohne Referenz: nur, was sich ohne Wahrheit prüfen lässt</text><circle cx="292" cy="194" r="2.6" fill="#2a78d6"/><text x="302.0" y="198.0" font-size="11" fill="#17171a" font-weight="600" text-anchor="start">Tool selection / Tool parameter accuracy</text><text x="816.0" y="198.0" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="end">Built-in</text><circle cx="292" cy="216" r="2.6" fill="#2a78d6"/><text x="302.0" y="220.0" font-size="11" fill="#17171a" font-weight="600" text-anchor="start">Faithfulness — Antwort vs. Ergebnis</text><text x="816.0" y="220.0" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="end">Built-in</text><circle cx="292" cy="238" r="2.6" fill="#2a78d6"/><text x="302.0" y="242.0" font-size="11" fill="#17171a" font-weight="600" text-anchor="start">SQL-Plausibilität, Definitionen im Prompt</text><text x="816.0" y="242.0" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="end">Custom · starkes Modell</text><circle cx="292" cy="260" r="2.6" fill="#2a78d6"/><text x="302.0" y="264.0" font-size="11" fill="#17171a" font-weight="600" text-anchor="start">Regelcheck: Partitionsfilter, Schrittzahl</text><text x="816.0" y="264.0" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="end">Lambda</text><rect x="274.0" y="326.0" width="566.0" height="158.0" rx="6" fill="#e6f7f0" stroke="#1baf7a" stroke-width="1.3"/><text x="288.0" y="348.0" font-size="12.5" fill="#0f7a56" font-weight="600" text-anchor="start">Batch / Dataset — vor jedem Release</text><text x="288.0" y="366.0" font-size="10.8" fill="#56554f" font-weight="400" text-anchor="start">Golden Set mit Referenz: expected_response, Trajektorie, Assertions</text><circle cx="292" cy="386" r="2.6" fill="#1baf7a"/><text x="302.0" y="390.0" font-size="11" fill="#17171a" font-weight="600" text-anchor="start">Execution Accuracy — SQL auf Athena ausführen</text><text x="816.0" y="390.0" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="end">Lambda</text><circle cx="292" cy="408" r="2.6" fill="#1baf7a"/><text x="302.0" y="412.0" font-size="11" fill="#17171a" font-weight="600" text-anchor="start">SQL-Äquivalenz, wo das Ergebnis abweicht</text><text x="816.0" y="412.0" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="end">Custom · kleines Modell</text><circle cx="292" cy="430" r="2.6" fill="#1baf7a"/><text x="302.0" y="434.0" font-size="11" fill="#17171a" font-weight="600" text-anchor="start">Trajektorie — richtige Werkzeuge, wenige Schritte</text><text x="816.0" y="434.0" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="end">Custom</text><circle cx="292" cy="452" r="2.6" fill="#1baf7a"/><text x="302.0" y="456.0" font-size="11" fill="#17171a" font-weight="600" text-anchor="start">Assertions — fragt nach, wenn „Umsatz“ unklar ist</text><text x="816.0" y="456.0" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="end">Custom</text><rect x="262.0" y="524.0" width="590.0" height="52.0" rx="6" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.2"/><text x="276.0" y="545.0" font-size="11.5" fill="#a33a12" font-weight="600" text-anchor="start">Schlecht bewertete Online-Sessions  →  menschliche Prüfung  →  neue Golden-Fragen</text><text x="276.0" y="563.0" font-size="10.5" fill="#56554f" font-weight="400" text-anchor="start">So wächst das Golden Set aus echten Fragen statt aus ausgedachten.</text><path d="M 832 292 L 864 292 L 864 550 L 854 550" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ao)"/><path d="M 844 550 L 844 550" /><path d="M 290 522 L 290 486" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ao)"/></svg>