<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Reciprocal Rank Fusion in Azure AI Search</title><desc id="d">Zwei Trefferlisten aus BM25 und Vektorsuche werden zu einer fusionierten Liste verrechnet; jeder Platz steuert 1 durch 60 plus Platz bei.</desc><rect x="0" y="0" width="880" height="470" fill="#fcfcfb"/><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Wie Azure AI Search die zwei Listen verschmilzt</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Reciprocal Rank Fusion: jede Liste steuert 1/(60 + Platz) bei, die Beiträge werden addiert.</text><text x="28" y="80" font-size="12.5" fill="#82807a" font-weight="400" text-anchor="start">Gerechnet wird mit Plätzen, nicht mit Scores — deshalb müssen die Skalen nicht vergleichbar sein.</text><text x="146.0" y="118" font-size="13" fill="#17171a" font-weight="600" text-anchor="middle">BM25 (Volltext)</text><rect x="28" y="132" width="236" height="30" rx="5" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.2"/><text x="38" y="152" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1.</text><text x="58" y="152" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">GUT57_chunk_01</text><text x="254" y="152" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1/61</text><rect x="28" y="168" width="236" height="30" rx="5" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.2"/><text x="38" y="188" font-size="11.5" fill="#eb6834" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">2.</text><text x="58" y="188" font-size="11.5" fill="#17171a" 