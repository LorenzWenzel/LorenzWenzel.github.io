<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 236" width="900" height="236" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Zusammensetzung der AgentCore-Infrastrukturkosten</title><desc id="d">Ein Balken: Memory-Events 2,50, Leerlauf-Speicher 0,47, Lambda 0,20, aktiver Speicher 0,06, CPU 0,05, Gateway 0,02 Dollar.</desc><rect x="0" y="0" width="900" height="236" fill="#fcfcfb"/><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Woraus die 3,30 $ je 1 000 Fragen bestehen</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">AgentCore harness mit Gateway und Memory. Die Runtime selbst ist der kleinste Posten.</text><rect x="28.0" y="104" width="637.4" height="36" rx="3" fill="#2a78d6"/><text x="346.6969696969697" y="126.0" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">2,50 $</text><rect x="667.4" y="104" width="118.2" height="36" rx="3" fill="#eb6834"/><text x="726.4969696969697" y="126.0" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">0,47 $</text><rect x="787.6" y="104" width="49.2" height="36" rx="3" fill="#8a8f96"/><rect x="838.8" y="104" width="13.3" height="36" rx="3" fill="#b5b9bf"/><rect x="854.1" y="104" width="10.8" height="36" rx="3" fill="#c9ccd1"/><rect x="866.9" y="104" width="3.1" height="36" rx="3" fill="#dcdee2"/><rect x="28" y="162" width="11" height="11" rx="2.5" fill="#2a78d6"/><text x="44" y="172" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="start">Memory-Events  2,50 $</text><rect x="312" y="162" width="11" height="11" rx="2.5" fill="#eb6834"/><text x="328" y="172" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="start">Leerlauf-Speicher (15 min)  0,47 $</text><rect