<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 398" width="880" height="398" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Strategien fuer den Gespraechsverlauf</title><desc id="d">Fuenf Zeilen mit je zehn Turn-Bloecken: alles behalten, gleitendes Fenster, Fenster mit Zusammenfassung, Retrieval und eine Mischung.</desc><rect x="0" y="0" width="880" height="398" fill="#fcfcfb"/><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Vier Wege, einen Verlauf kleinzuhalten</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Zehn zurückliegende Turns, von links nach rechts. Was geht mit, was bleibt draußen?</text><rect x="28" y="80" width="11" height="11" rx="2.5" fill="#2a78d6"/><text x="45" y="90" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">mitgeschickt</text><rect x="214" y="80" width="11" height="11" rx="2.5" fill="#dcdbd6"/><text x="231" y="90" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">weggelassen</text><rect x="400" y="80" width="11" height="11" rx="2.5" fill="#eb6834"/><text x="417" y="90" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">verdichtet</text><text x="226" y="120" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">älter  →  neuer</text><text x="212" y="149" font-size="13" fill="#17171a" font-weight="600" text-anchor="end">Alles behalten</text><rect x="226" y="132" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="257" y="132" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="288" y="132" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="319" y="132" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="350" y="132" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="381" y="132" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="412" y="132" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="443" y="132" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="474" y="132" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="505" y="132" width="26" height="24" rx="3" fill="#2a78d6"/><text x="546" y="149" font-size="11.5" fill="#82807a" font-weight="400" text-anchor="start">einfach, teuer, und ab einer gewissen Länge schlechter</text><text x="212" y="195" font-size="13" fill="#17171a" font-weight="600" text-anchor="end">Gleitendes Fenster</text><rect x="226" y="178" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="257" y="178" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="288" y="178" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="319" y="178" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="350" y="178" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="381" y="178" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="412" y="178" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="443" y="178" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="474" y="178" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="505" y="178" width="26" height="24" rx="3" fill="#2a78d6"/><text x="546" y="195" font-size="11.5" fill="#82807a" font-weight="400" text-anchor="start">billig – verliert aber abrupt, was gerade herausfällt</text><text x="212" y="241" font-size="13" fill="#17171a" font-weight="600" text-anchor="end">Fenster + Zusammenfassung</text><rect x="226" y="224" width="26" height="24" rx="3" fill="#eb6834"/><text x="239.0" y="241" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Σ</text><rect x="257" y="224" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="288" y="224" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="319" y="224" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="350" y="224" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="381" y="224" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="412" y="224" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="443" y="224" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="474" y="224" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="505" y="224" width="26" height="24" rx="3" fill="#2a78d6"/><text x="546" y="241" font-size="11.5" fill="#82807a" font-weight="400" text-anchor="start">hält den roten Faden, verliert Details schleichend</text><text x="212" y="287" font-size="13" fill="#17171a" font-weight="600" text-anchor="end">Retrieval</text><rect x="226" y="270" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="257" y="270" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="288" y="270" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="319" y="270" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="350" y="270" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="381" y="270" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="412" y="270" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="443" y="270" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="474" y="270" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="505" y="270" width="26" height="24" rx="3" fill="#dcdbd6"/><text x="546" y="287" font-size="11.5" fill="#82807a" font-weight="400" text-anchor="start">findet Altes wieder – auch über Sitzungen hinweg</text><text x="212" y="333" font-size="13" fill="#17171a" font-weight="600" text-anchor="end">Mischung</text><rect x="226" y="316" width="26" height="24" rx="3" fill="#eb6834"/><text x="239.0" y="333" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Σ</text><rect x="257" y="316" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="288" y="316" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="319" y="316" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="350" y="316" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="381" y="316" width="26" height="24" rx="3" fill="#dcdbd6"/><rect x="412" y="316" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="443" y="316" width="26" height="24" rx="3" fill="#2a78d6"/><rect x="474" y="316" width="26" height="24" rx="3" fill="#2a78d6"/><text x="546" y="333" font-size="11.5" fill="#82807a" font-weight="400" text-anchor="start">der Produktionsfall: verdichten, gezielt holen, Letztes behalten</text></svg>