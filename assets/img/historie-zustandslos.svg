<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 472" width="880" height="472" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Der Verlauf waechst mit jedem Turn</title><desc id="d">Saeulen ueber sechs Turns: der Anteil frueher gesendeter Token waechst, der neue Anteil bleibt konstant.</desc><rect x="0" y="0" width="880" height="472" fill="#fcfcfb"/><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Das Modell erinnert sich an nichts</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Was in Turn 1 gesagt wurde, wird in Turn 6 zum sechsten Mal übertragen und zum sechsten Mal bezahlt.</text><rect x="28" y="80" width="11" height="11" rx="2.5" fill="#eb6834"/><text x="45" y="90" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">neu in diesem Turn</text><rect x="210" y="80" width="11" height="11" rx="2.5" fill="#2a78d6"/><text x="227" y="90" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">schon früher gesendet – und erneut abgerechnet</text><line x1="76" y1="386.0" x2="832" y2="386.0" stroke="#e7e6e1" stroke-width="1"/><text x="66" y="390.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">0k</text><line x1="76" y1="323.5" x2="832" y2="323.5" stroke="#e7e6e1" stroke-width="1"/><text x="66" y="327.5" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">3k</text><line x1="76" y1="261.0" x2="832" y2="261.0" stroke="#e7e6e1" stroke-width="1"/><text x="66" y="265.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">5k</text><line x1="76" y1="198.5" x2="832" y2="198.5" stroke="#e7e6e1" stroke-width="1"/><text x="66" y="202.5" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">8k</text><line x1="76" y1="136.0" x2="832" y2="136.0" stroke="#e7e6e1" stroke-width="1"/><text x="66" y="140.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">11k</text><rect x="110.0" y="347.4" width="58" height="38.6" rx="3" fill="#eb6834"/><text x="139.0" y="339.41975308641975" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1 640</text><text x="139.0" y="405.0" font-size="12" fill="#56554f" font-weight="400" text-anchor="middle">Turn 1</text><rect x="236.0" y="308.8" width="58" height="36.6" rx="3" fill="#eb6834"/><rect x="236.0" y="347.4" width="58" height="38.6" rx="3" fill="#2a78d6"/><text x="265.0" y="300.8395061728395" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">3 280</text><text x="265.0" y="405.0" font-size="12" fill="#56554f" font-weight="400" text-anchor="middle">Turn 2</text><rect x="362.0" y="270.3" width="58" height="36.6" rx="3" fill="#eb6834"/><rect x="362.0" y="308.8" width="58" height="77.2" rx="3" fill="#2a78d6"/><text x="391.0" y="262.25925925925924" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">4 920</text><text x="391.0" y="405.0" font-size="12" fill="#56554f" font-weight="400" text-anchor="middle">Turn 3</text><rect x="488.0" y="231.7" width="58" height="36.6" rx="3" fill="#eb6834"/><rect x="488.0" y="270.3" width="58" height="115.7" rx="3" fill="#2a78d6"/><text x="517.0" y="223.67901234567904" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">6 560</text><text x="517.0" y="405.0" font-size="12" fill="#56554f" font-weight="400" text-anchor="middle">Turn 4</text><rect x="614.0" y="193.1" width="58" height="36.6" rx="3" fill="#eb6834"/><rect x="614.0" y="231.7" width="58" height="154.3" rx="3" fill="#2a78d6"/><text x="643.0" y="185.09876543209876" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">8 200</text><text x="643.0" y="405.0" font-size="12" fill="#56554f" font-weight="400" text-anchor="middle">Turn 5</text><rect x="740.0" y="154.5" width="58" height="36.6" rx="3" fill="#eb6834"/><rect x="740.0" y="193.1" width="58" height="192.9" rx="3" fill="#2a78d6"/><text x="769.0" y="146.51851851851853" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">9 840</text><text x="769.0" y="405.0" font-size="12" fill="#56554f" font-weight="400" text-anchor="middle">Turn 6</text><text x="76" y="426" font-size="11.5" fill="#82807a" font-weight="400" text-anchor="start">Rechenbeispiel: je Turn eine Frage, ein Tool-Ergebnis, eine Antwort – zusammen rund 1 640 Token.</text><text x="76" y="444" font-size="11.5" fill="#82807a" font-weight="400" text-anchor="start">Der Systemprompt mit Schemata und Tool-Definitionen kommt oben drauf; ihn fängt der Cache ab, den Verlauf nicht.</text></svg>