<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Modellaufrufe sind nicht Toolaufrufe</title><desc id="d">Oben: sechs parallele Toolaufrufe zwischen zwei Modellaufrufen. Unten: sechs sequenzielle Toolaufrufe zwischen sieben Modellaufrufen.</desc><rect x="0" y="0" width="880" height="372" fill="#fcfcfb"/><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Modellaufrufe sind nicht Toolaufrufe</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Sechsmal dasselbe Werkzeug-Pensum. Was sich unterscheidet, ist die Form der Kette.</text><rect x="28" y="78" width="11" height="11" rx="2.5" fill="#2a78d6"/><text x="45" y="88" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">Modellaufruf – wird abgerechnet</text><rect x="290" y="78" width="11" height="11" rx="2.5" fill="#eb6834"/><text x="307" y="88" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">Toolaufruf – kostet keinen Modellaufruf</text><text x="28" y="134" font-size="14" fill="#17171a" font-weight="600" text-anchor="start">breit</text><text x="28" y="152" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="start">6 Tools in</text><text x="28" y="168" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="start">einer Runde</text><text x="28" y="194" font-size="12" fill="#2a78d6" font-weight="600" text-anchor="start">2 Modellaufrufe</text><rect x="176" y="146" width="70" height="32" rx="6" fill="#2a78d6"/><text x="211" y="167" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">1</text><rect x="280" y="118" width="104" height="13" rx="3" fill="#eb6834"/><rect x="280" y="134" width="104" height="13" rx="3" fill="#eb6834"/><rect x="280" y="150" width="104" height="13" rx="3" fill="#eb6834"/><rect x="280" y="166" width="104" height="13" rx="3" fill="#eb6834"/><rect x="280" y="182" width="104" height="13" rx="3" fill="#eb6834"/><rect x="280" y="198" width="104" height="13" rx="3" fill="#eb6834"/><text x="332" y="226" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="middle">parallel</text><line x1="248" y1="162" x2="271" y2="162" stroke="#82807a" stroke-width="1.6"/><path d="M271,157.5 L278,162 L271,166.5 Z" fill="#82807a"/><line x1="386" y1="162" x2="409" y2="162" stroke="#82807a" stroke-width="1.6"/><path d="M409,157.5 L416,162 L409,166.5 Z" fill="#82807a"/><rect x="418" y="146" width="70" height="32" rx="6" fill="#2a78d6"/><text x="453" y="167" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">2</text><text x="506" y="167" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">→  Antwort</text><text x="28" y="274" font-size="14" fill="#17171a" font-weight="600" text-anchor="start">tief</text><text x="28" y="292" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="start">6 Runden</text><text x="28" y="308" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="start">à 1 Tool</text><text x="28" y="334" font-size="12" fill="#2a78d6" font-weight="600" text-anchor="start">7 Modellaufrufe</text><rect x="176" y="286" width="40" height="32" rx="6" fill="#2a78d6"/><text x="196" y="307" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">1</text><rect x="223" y="294" width="34" height="16" rx="3" fill="#eb6834"/><rect x="264" y="286" width="40" height="32" rx="6" fill="#2a78d6"/><text x="284" y="307" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">2</text><rect x="311" y="294" width="34" height="16" rx="3" fill="#eb6834"/><rect x="352" y="286" width="40" height="32" rx="6" fill="#2a78d6"/><text x="372" y="307" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">3</text><rect x="399" y="294" width="34" height="16" rx="3" fill="#eb6834"/><rect x="440" y="286" width="40" height="32" rx="6" fill="#2a78d6"/><text x="460" y="307" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">4</text><rect x="487" y="294" width="34" height="16" rx="3" fill="#eb6834"/><rect x="528" y="286" width="40" height="32" rx="6" fill="#2a78d6"/><text x="548" y="307" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">5</text><rect x="575" y="294" width="34" height="16" rx="3" fill="#eb6834"/><rect x="616" y="286" width="40" height="32" rx="6" fill="#2a78d6"/><text x="636" y="307" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">6</text><rect x="663" y="294" width="34" height="16" rx="3" fill="#eb6834"/><rect x="704" y="286" width="40" height="32" rx="6" fill="#2a78d6"/><text x="724" y="307" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">7</text><text x="756" y="307" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">→  Antwort</text><text x="176" y="340" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="start">jede Runde schickt den gesamten bisherigen Verlauf erneut mit</text></svg>