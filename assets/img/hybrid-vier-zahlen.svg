<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Die vier Grenzen einer hybriden Abfrage</title><desc id="d">maxTextRecallSize, k_nearest_neighbors, die RRF-Konstante k und top - drei steuern Mengen, die RRF-Konstante nicht.</desc><rect x="0" y="0" width="880" height="340" fill="#fcfcfb"/><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Vier Zahlen, die alle „k“ heißen</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">In einer hybriden Abfrage stecken vier verschiedene Grenzen. Drei davon steuern Mengen, eine nicht.</text><rect x="28" y="110" width="196" height="118" rx="8" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/><text x="126.0" y="136" font-size="13" fill="#17171a" font-weight="600" text-anchor="middle">maxTextRecallSize</text><text x="126.0" y="155" font-size="11.5" fill="#eb6834" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Standard 1 000</text><text x="126.0" y="180" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">wie viele Treffer die</text><text x="126.0" y="196" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">Volltextseite überhaupt liefert</text><line x1="226" y1="169.0" x2="235" y2="169.0" stroke="#82807a" stroke-width="1.6"/><path d="M235,165.0 L241,169.0 L235,173.0 Z" fill="#82807a"/><rect x="239" y="110" width="196" height="118" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.5"/><text x="337.0" y="136" font-size="13" fill="#17171a" font-weight="600" text-anchor="middle">k_nearest_neighbors</text><text x="337.0" y="155" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">im POC 60</text><text x="337.0" y="180" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">wie viele Nachbarn die</text><text x="337.0" y="196" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">Vektorseite zurückgibt</text><line x1="437" y1="169.0" x2="446" y2="169.0" stroke="#82807a" stroke-width="1.6"/><path d="M446,165.0 L452,169.0 L446,173.0 Z" fill="#82807a"/><rect x="450" y="110" width="196" height="118" rx="8" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="6 4"/><text x="548.0" y="136" font-size="13" fill="#17171a" font-weight="600" text-anchor="middle">RRF-k</text><text x="548.0" y="155" font-size="11.5" fill="#eb6834" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">fest 60</text><text x="548.0" y="180" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">KEINE Menge — die Konstante</text><text x="548.0" y="196" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">in 1/(k + Platz)</text><line x1="648" y1="169.0" x2="657" y2="169.0" stroke="#82807a" stroke-width="1.6"/><path d="M657,165.0 L663,169.0 L657,173.0 Z" fill="#82807a"/><rect x="661" y="110" width="196" height="118" rx="8" fill="#f1f1ee" stroke="#82807a" stroke-width="1.5"/><text x="759.0" y="136" font-size="13" fill="#17171a" font-weight="600" text-anchor="middle">top</text><text x="759.0" y="155" font-size="11.5" fill="#82807a" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">im POC 60</text><text x="759.0" y="180" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">wie viele Treffer am Ende</text><text x="759.0" y="196" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">herauskommen</text><rect x="28" y="250" width="824" height="56" rx="7" fill="#fdf0ea"/><text x="44" y="274" font-size="12" fill="#a33a12" font-weight="400" text-anchor="start">Die Dokumentation warnt ausdrücklich: das k in RRF ist „entirely separate“ vom k der Vektorsuche.</text><text x="44" y="294" font-size="12" fill="#a33a12" font-weight="400" text-anchor="start">Es größer zu setzen holt keine weiteren Treffer — es flacht nur die Gewichtung zwischen den Plätzen ab.</text></svg>