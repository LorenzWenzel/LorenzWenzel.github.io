<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 228" width="880" height="228" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Reihenfolge des gecachten Praefix</title><desc id="d">Drei Bloecke: tools, system, messages. Der Cache-Breakpoint sitzt hinter system; eine Aenderung in tools entwertet alles dahinter.</desc><rect x="0" y="0" width="880" height="228" fill="#fcfcfb"/><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Was vor dem Breakpoint steht, wird gecacht</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Bedrock prüft in dieser Reihenfolge. Eine Änderung entwertet alles rechts davon.</text><rect x="28" y="92" width="176" height="56" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.4"/><text x="116.0" y="117" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">tools</text><text x="116.0" y="135" font-size="11" fill="#dbe9fb" font-weight="400" text-anchor="middle">MCP-Definitionen</text><rect x="210" y="92" width="214" height="56" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.4"/><text x="317.0" y="117" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">system</text><text x="317.0" y="135" font-size="11" fill="#dbe9fb" font-weight="400" text-anchor="middle">Prompt + Schemata</text><rect x="430" y="92" width="300" height="56" rx="6" fill="#ffffff" stroke="#d8d7d1" stroke-width="1.4"/><text x="580.0" y="117" font-size="13.5" fill="#17171a" font-weight="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">messages</text><text x="580.0" y="135" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">Verlauf + Frage</text><line x1="427" y1="76" x2="427" y2="164" stroke="#eb6834" stroke-width="2.5"/><text x="435" y="72" font-size="11.5" fill="#eb6834" font-weight="600" text-anchor="start">Cache-Breakpoint</text><text x="28" y="182" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="start">gecacht – ab dem zweiten Aufruf 10 % des Preises</text><text x="435" y="182" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="start">wechselt bei jeder Frage – voller Preis</text><rect x="28" y="196" width="824" height="30" rx="6" fill="#fdf0ea"/><text x="40" y="216" font-size="11.5" fill="#a33a12" font-weight="400" text-anchor="start">Ändert ein MCP-Server seine Werkzeugliste, ist nicht nur tools ungültig, sondern system und messages gleich mit.</text></svg>