<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Formatentscheidung im text2SQL-Agenten</title><desc id="d">Ablaufdiagramm: Nutzerfrage, Agent auf Bedrock, MCP-Server, Athena; der Rueckweg fuehrt ueber die Serialisierung des Resultsets ins Kontextfenster.</desc><rect x="0" y="0" width="880" height="290" fill="#fcfcfb"/><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Wo im text2SQL-Agenten die Formatentscheidung fällt</text><text x="28" y="59" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Der Rückweg ist der teure: alles, was das Tool zurückgibt, wird Kontext – und bei jedem Folgeturn erneut bezahlt.</text><rect x="28.0" y="96" width="178" height="62" rx="7" fill="#ffffff" stroke="#d8d7d1" stroke-width="1.2"/><text x="117.0" y="122" font-size="13.5" fill="#17171a" font-weight="600" text-anchor="middle">Nutzer­frage</text><text x="117.0" y="141" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="middle">„Umsatz je Region?“</text><line x1="212.0" y1="127.0" x2="230.33333333333334" y2="127.0" stroke="#82807a" stroke-width="1.6"/><path d="M230.33333333333334,122.5 L237.33333333333334,127.0 L230.33333333333334,131.5 Z" fill="#82807a"/><rect x="243.33333333333334" y="96" width="178" height="62" rx="7" fill="#ffffff" stroke="#d8d7d1" stroke-width="1.2"/><text x="332.33333333333337" y="122" font-size="13.5" fill="#17171a" font-weight="600" text-anchor="middle">Agent</text><text x="332.33333333333337" y="141" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="middle">Claude auf Bedrock</text><line x1="427.33333333333337" y1="127.0" x2="445.6666666666667" y2="127.0" stroke="#82807a" stroke-width="1.6"/><path d="M445.6666666666667,122.5 L452.6666666666667,127.0 L445.6666666666667,131.5 Z" fill="#82807a"/><rect x="458.6666666666667" y="96" width="178" height="62" rx="7" fill="#ffffff" stroke="#d8d7d1" stroke-width="1.2"/><text x="547.6666666666667" y="122" font-size="13.5" fill="#17171a" font-weight="600" text-anchor="middle">MCP-Server</text><text x="547.6666666666667" y="141" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="middle">Tool: run_query</text><line x1="642.6666666666667" y1="127.0" x2="661.0000000000001" y2="127.0" stroke="#82807a" stroke-width="1.6"/><path d="M661.0000000000001,122.5 L668.0000000000001,127.0 L661.0000000000001,131.5 Z" fill="#82807a"/><rect x="674.0" y="96" width="178" height="62" rx="7" fill="#ffffff" stroke="#d8d7d1" stroke-width="1.2"/><text x="763.0" y="122" font-size="13.5" fill="#17171a" font-weight="600" text-anchor="middle">Amazon Athena</text><text x="763.0" y="141" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="middle">Presto → flaches Resultset</text><path d="M763.0,166 L763.0,192 L131.0,192" fill="none" stroke="#eb6834" stroke-width="2"/><path d="M138.0,187.5 L131.0,192 L138.0,196.5 Z" fill="#eb6834"/><rect x="361.7666666666667" y="170" width="300" height="44" rx="7" fill="#eb6834" /><text x="511.7666666666667" y="189" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">Serialisierung des Resultsets</text><text x="511.7666666666667" y="205" font-size="11" fill="#ffe8dd" font-weight="400" text-anchor="middle">CSV? JSON? Markdown? ← hier entsteht die Rechnung</text><rect x="28" y="218" width="178" height="62" rx="7" fill="#ffffff" stroke="#eb6834" stroke-width="1.6"/><text x="117.0" y="244" font-size="13.5" fill="#17171a" font-weight="600" text-anchor="middle">Kontextfenster</text><text x="117.0" y="263" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="middle">Zeilen werden Token</text></svg>