<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 462" width="900" height="462" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Infrastrukturkosten je 1000 Fragen ueber die Anfragedichte</title><desc id="d">Fargate-Dauerbetrieb faellt mit steigender Fragenzahl von ueber 30 auf unter 2 Dollar; AgentCore harness liegt konstant bei 3,30, eigener Code auf Runtime bei 1,16. Schnittpunkt bei etwa 22.000 Fragen im Monat.</desc><rect x="0" y="0" width="900" height="462" fill="#fcfcfb"/><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Was die Infrastruktur je 1 000 Fragen kostet</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Abhängig davon, wie viele Fragen im Monat kommen. Die Modellrechnung liegt bei ≈ 76 $ – außerhalb dieser Skala.</text><line x1="28" y1="84" x2="50" y2="84" stroke="#eb6834" stroke-width="2.4"/><text x="58" y="88" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">Converse + MCP, Fargate dauerhaft (2 Tasks)</text><line x1="358" y1="84" x2="380" y2="84" stroke="#2a78d6" stroke-width="2.4"/><text x="388" y="88" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">AgentCore harness + Gateway + Memory</text><line x1="648" y1="84" x2="670" y2="84" stroke="#8a8f96" stroke-width="2.4" stroke-dasharray="6 4"/><text x="678" y="88" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">eigener Code auf Runtime</text><line x1="76" y1="384.0" x2="840" y2="384.0" stroke="#e7e6e1" stroke-width="1"/><text x="66" y="388.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">$0</text><line x1="76" y1="300.7" x2="840" y2="300.7" stroke="#e7e6e1" stroke-width="1"/><text x="66" y="304.6666666666667" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">$10</text><line x1="76" y1="217.3" x2="840" y2="217.3" stroke="#e7e6e1" stro