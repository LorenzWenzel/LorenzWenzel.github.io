<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Was AgentCore Evaluations aus einer Frage macht: Session, Trace, Span und die drei Bewertungsebenen</title><desc id="d">Links eine Session mit zwei Traces. Der erste Trace ist aufgeklappt: ein invoke_agent-Span umschließt drei chat-Spans und zwei execute_tool-Spans, schema_fuer_frage und run_query. Der run_query-Span trägt Werkzeugname, das SQL als Argument, die Ergebniszeilen und Status und Dauer. Rechts die drei Bewertungsebenen: SESSION mit Goal success rate, Trajectory-Match und Failure analysis; TRACE mit Correctness, Faithfulness und Helpfulness; TOOL_CALL mit Tool selection accuracy, Tool parameter accuracy und eigenen Prüfungen als Custom-Judge oder Lambda.</desc><rect x="0" y="0" width="900" height="600" fill="#fcfcfb"/><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1baf7a"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker></defs><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Bewertet wird die Spur</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Eine Session, zwei Traces, drei Span-Typen – und die drei Ebenen, auf denen AgentCore Evaluations urteilt.</text>

<!-- Session -->
<rect x="28" y="84" width="540" height="488" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.4"/>
<text x="42" y="106" font-size="9.5" fill="#0f7a56" font-weight="600" text-anchor="start">SESSION</text><text x="96" y="106" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="start">eine Unterhaltung · session.id</text>

<!-- Trace 1 -->
<rect x="44" y="120" width="508" height="336" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="58" y="142" font-size="9.5" fill="#a33a12" font-weight="600" text-anchor="start">TRACE 1</text><text x="108" y="142" font-size="11.5" fill="#17171a" font-weight="500" text-anchor="start">„Nettoumsatz je Region im dritten Quartal?“</text>

<!-- waterfall -->
<text x="60" y="172" font-size="10.5" fill="#17171a" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">invoke_agent</text>
<rect x="262" y="156" width="274" height="22" rx="4" fill="#f0f0ee" stroke="#8a8f96" stroke-width="1.1"/><text x="528" y="171" font-size="10.5" fill="#56554f" font-weight="400" text-anchor="end">der ganze Lauf: Frage → Antwort</text>

<text x="72" y="204" font-size="10.5" fill="#17171a" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">chat</text>
<rect x="262" y="188" width="38" height="22" rx="4" fill="#f0f0ee" stroke="#8a8f96" stroke-width="1.1"/>

<text x="72" y="236" font-size="10.5" fill="#17171a" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">execute_tool schema_fuer_frage</text>
<rect x="304" y="220" width="40" height="22" rx="4" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.3"/>

<text x="72" y="268" font-size="10.5" fill="#17171a" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">chat</text>
<rect x="348" y="252" width="48" height="22" rx="4" fill="#f0f0ee" stroke="#8a8f96" stroke-width="1.1"/>

<text x="72" y="300" font-size="10.5" fill="#17171a" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">execute_tool run_query</text>
<rect x="400" y="284" width="86" height="22" rx="4" fill="#cfe2fa" stroke="#2a78d6" stroke-width="1.6"/>

<text x="72" y="332" font-size="10.5" fill="#17171a" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">chat</text>
<rect x="490" y="316" width="46" height="22" rx="4" fill="#f0f0ee" stroke="#8a8f96" stroke-width="1.1"/>

<!-- callout run_query -->
<line x1="443" y1="307" x2="443" y2="350" stroke="#2a78d6" stroke-width="1.3"/>
<rect x="60" y="350" width="476" height="94" rx="5" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.2"/>
<text x="72" y="369" font-size="9.5" fill="#1c5cab" font-weight="600" text-anchor="start">DER SPAN, UM DEN ES BEI TEXT2SQL GEHT</text>
<text x="72" y="388" font-size="10.5" fill="#56554f" font-weight="400" text-anchor="start">Werkzeug</text><text x="140" y="388" font-size="10.5" fill="#17171a" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">run_query</text>
<text x="72" y="404" font-size="10.5" fill="#56554f" font-weight="400" text-anchor="start">Argument</text><text x="140" y="404" font-size="10.5" fill="#17171a" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">SELECT region, SUM(net_revenue_eur) FROM fact_orders …</text>
<text x="72" y="420" font-size="10.5" fill="#56554f" font-weight="400" text-anchor="start">Ergebnis</text><text x="140" y="420" font-size="10.5" fill="#17171a" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">region,net_revenue_eur ↵ EU-Central,1812440.10 ↵ …</text>
<text x="72" y="436" font-size="10.5" fill="#56554f" font-weight="400" text-anchor="start">Status</text><text x="140" y="436" font-size="10.5" fill="#17171a" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">success · 8,2 s</text>

<!-- Trace 2 -->
<rect x="44" y="468" width="508" height="44" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.3"/>
<text x="58" y="494" font-size="9.5" fill="#a33a12" font-weight="600" text-anchor="start">TRACE 2</text><text x="108" y="494" font-size="11.5" fill="#17171a" font-weight="500" text-anchor="start">„Und dasselbe für das vierte?“</text>
<rect x="404" y="482" width="132" height="16" rx="3" fill="#f0f0ee" stroke="#8a8f96" stroke-width="1"/><rect x="408" y="486" width="16" height="8" rx="2" fill="#c9c8c3"/><rect x="428" y="486" width="46" height="8" rx="2" fill="#2a78d6"/><rect x="478" y="486" width="20" height="8" rx="2" fill="#c9c8c3"/>

<text x="44" y="536" font-size="11" fill="#56554f" font-weight="400" text-anchor="start">Die chat-Spans sind keine eigene Bewertungsebene. Sie liefern das Material</text>
<text x="44" y="552" font-size="11" fill="#56554f" font-weight="400" text-anchor="start">drumherum: Systemprompt, Nachrichten, Werkzeugliste – und die Token-Zähler.</text>

<!-- right: levels -->
<rect x="596" y="84" width="276" height="152" rx="6" fill="#e6f7f0" stroke="#1baf7a" stroke-width="1.3"/>
<text x="610" y="104" font-size="9.5" fill="#0f7a56" font-weight="600" text-anchor="start">SESSION</text><text x="610" y="121" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="start">die ganze Unterhaltung</text>
<text x="610" y="146" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="start">Ziel erreicht?</text><text x="610" y="160" font-size="10" fill="#56554f" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">Builtin.GoalSuccessRate</text>
<text x="610" y="180" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="start">Werkzeugfolge wie erwartet?</text><text x="610" y="194" font-size="10" fill="#56554f" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">Builtin.Trajectory…Match</text>
<text x="610" y="214" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="start">Wo und warum scheitert es?</text><text x="610" y="228" font-size="10" fill="#56554f" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">Builtin.FailureAnalysis</text>

<rect x="596" y="250" width="276" height="152" rx="6" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.3"/>
<text x="610" y="270" font-size="9.5" fill="#a33a12" font-weight="600" text-anchor="start">TRACE</text><text x="610" y="287" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="start">eine Frage, eine Antwort</text>
<text x="610" y="312" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="start">Antwort sachlich richtig?</text><text x="610" y="326" font-size="10" fill="#56554f" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">Builtin.Correctness</text>
<text x="610" y="346" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="start">Antwort treu zum Tool-Ergebnis?</text><text x="610" y="360" font-size="10" fill="#56554f" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">Builtin.Faithfulness</text>
<text x="610" y="380" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="start">Hilfreich, relevant, knapp?</text><text x="610" y="394" font-size="10" fill="#56554f" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">Builtin.Helpfulness u. a.</text>

<rect x="596" y="416" width="276" height="156" rx="6" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.3"/>
<text x="610" y="436" font-size="9.5" fill="#1c5cab" font-weight="600" text-anchor="start">TOOL_CALL</text><text x="610" y="453" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="start">ein einzelner Werkzeugaufruf</text>
<text x="610" y="478" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="start">Richtiges Werkzeug, nicht doppelt?</text><text x="610" y="492" font-size="10" fill="#56554f" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">Builtin.ToolSelectionAccuracy</text>
<text x="610" y="512" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="start">Werte im SQL aus dem Kontext?</text><text x="610" y="526" font-size="10" fill="#56554f" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">Builtin.ToolParameterAccuracy</text>
<text x="610" y="546" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="start">Eigene Regeln für das SQL</text><text x="610" y="560" font-size="10" fill="#56554f" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">Custom-Judge oder Lambda</text>

