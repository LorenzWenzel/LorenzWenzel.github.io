<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 408" width="880" height="408" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Preisschwelle fuer Modelle ohne Caching</title><desc id="d">Balken: DeepSeek 28,2 Prozent, Qwen3-Coder-Next 27,3, Mistral Large 3 22,7, Llama 3.3 70B 18,2, Qwen3 32B 6,8 Prozent des Sonnet-Preises.</desc><rect x="0" y="0" width="880" height="408" fill="#fcfcfb"/><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Wo ein Modell ohne Caching stehen müsste</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Input-Preis als Anteil des Sonnet-5-Preises. Die Linien zeigen, wie billig ein Modell ohne</text><text x="28" y="77" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Caching sein müsste, um Sonnet 5 mit Caching beim Präfix zu schlagen.</text><rect x="28" y="96" width="11" height="11" rx="2.5" fill="#2a78d6"/><text x="45" y="106" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">Preis des Modells</text><line x1="200" y1="101" x2="224" y2="101" stroke="#eb6834" stroke-width="2" stroke-dasharray="5 3"/><text x="232" y="106" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">Schwelle je Kettenlänge – ein Balken darüber hinaus ist teurer als Sonnet 5 mit Caching</text><line x1="662.8" y1="134" x2="662.8" y2="360" stroke="#eb6834" stroke-width="1.6" stroke-dasharray="5 3"/><text x="662.7563636363636" y="128" font-size="10.5" fill="#eb6834" font-weight="600" text-anchor="middle">3 Aufrufe</text><line x1="443.0" y1="134" x2="443.0" y2="360" stroke="#eb6834" stroke-width="1.6" stroke-dasharray="5 3"/><text x="442.96" y="128" font-size="10.5" fill="#eb6834" font-weight="600" text-anchor="middle">7 Aufrufe</text><line x1="336.6" y1="134" x2="336.6" y2="360" stroke="#eb6834" stroke-width="1.6" stroke-dasharray="5 3"/><text x="336.5745454545455" y="128" font-size="10.5" fill="#eb6834" font-weight="600" text-anchor="middle">20 Aufrufe</text><text x="164" y="168" font-size="13" fill="#17171a" font-weight="400" text-anchor="end">DeepSeek v3.2</text><rect x="178" y="150" width="283.0" height="26" rx="4" fill="#2a78d6"/><text x="746" y="168" font-size="12" fill="#17171a" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">28.2 %</text><text x="164" y="212" font-size="13" fill="#17171a" font-weight="400" text-anchor="end">Qwen3-Coder-Next</text><rect x="178" y="194" width="274.0" height="26" rx="4" fill="#2a78d6"/><text x="746" y="212" font-size="12" fill="#17171a" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">27.3 %</text><text x="164" y="256" font-size="13" fill="#17171a" font-weight="400" text-anchor="end">Mistral Large 3</text><rect x="178" y="238" width="227.8" height="26" rx="4" fill="#2a78d6"/><text x="746" y="256" font-size="12" fill="#17171a" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">22.7 %</text><text x="164" y="300" font-size="13" fill="#17171a" font-weight="400" text-anchor="end">Llama 3.3 70B</text><rect x="178" y="282" width="182.7" height="26" rx="4" fill="#2a78d6"/><text x="746" y="300" font-size="12" fill="#17171a" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">18.2 %</text><text x="164" y="344" font-size="13" fill="#17171a" font-weight="400" text-anchor="end">Qwen3 32B</text><rect x="178" y="326" width="68.2" height="26" rx="4" fill="#2a78d6"/><text x="746" y="344" font-size="12" fill="#17171a" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">6.8 %</text><text x="178" y="394" font-size="11.5" fill="#82807a" font-weight="400" text-anchor="start">Nur Qwen3 32B bleibt unter jeder Schwelle – und ist zugleich das schwächste Modell der Liste.</text></svg>