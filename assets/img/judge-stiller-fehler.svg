<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Der stille Fehler</title><desc id="d">Zwei Zeilen. Oben ein Judge ohne Referenz: Der Agent schreibt SUM(gross_revenue) statt netto, Athena liefert 4,21 Millionen, die Antwort gibt 4,21 Millionen wieder, und der Judge bewertet sie als Perfectly Correct, weil sie zum Tool-Output passt. Unten ein Judge mit Referenz: Das Golden SQL mit SUM(net_revenue) liefert 3,58 Millionen, der Vergleich ergibt eine Abweichung und das Urteil FAIL.</desc><rect x="0" y="0" width="880" height="470" fill="#fcfcfb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56554f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1baf7a"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#82807a"/></marker></defs><text x="28.0" y="38.0" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Der stille Fehler</text><text x="28.0" y="60.0" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Frage: „Wie hoch war der Umsatz in EU-Central im dritten Quartal?“</text><text x="28.0" y="78.0" font-size="12.5" fill="#82807a" font-weight="400" text-anchor="start">Gemeint ist netto — so ist Umsatz im Controlling definiert. Der Agent rechnet brutto.</text><text x="28.0" y="110.0" font-size="12.5" fill="#17171a" font-weight="600" text-anchor="start">Judge ohne Referenz</text><rect x="28.0" y="120.0" width="196.0" height="62.0" rx="5" fill="#ffffff" stroke="#dcdbd6" stroke-width="1.2"/><text x="39.0" y="138.0" font-size="9.5" fill="#82807a" font-weight="600" text-anchor="start">SQL DES AGENTEN</text><text x="39.0" y="156.0" font-size="11" fill="#17171a" font-weight="500" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">SUM(gross_revenue)</text><text x="39.0" y="172.0" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">brutto statt netto</text><line x1="226.0" y1="151.0" x2="234.0" y2="151.0" stroke="#56554f" stroke-width="1.6" marker-end="url(#a)"/><rect x="238.0" y="120.0" width="166.0" height="62.0" rx="5" fill="#ffffff" stroke="#dcdbd6" stroke-width="1.2"/><text x="249.0" y="138.0" font-size="9.5" fill="#82807a" font-weight="600" text-anchor="start">ATHENA</text><text x="249.0" y="156.0" font-size="11.5" fill="#17171a" font-weight="500" text-anchor="start">4,21 Mio. €</text><text x="249.0" y="172.0" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">korrekt ausgeführt</text><line x1="406.0" y1="151.0" x2="414.0" y2="151.0" stroke="#56554f" stroke-width="1.6" marker-end="url(#a)"/><rect x="418.0" y="120.0" width="182.0" height="62.0" rx="5" fill="#ffffff" stroke="#dcdbd6" stroke-width="1.2"/><text x="429.0" y="138.0" font-size="9.5" fill="#82807a" font-weight="600" text-anchor="start">ANTWORT</text><text x="429.0" y="156.0" font-size="11.5" fill="#17171a" font-weight="500" text-anchor="start">„Der Umsatz lag bei</text><text x="429.0" y="172.0" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">4,21 Mio. €.“</text><line x1="602.0" y1="151.0" x2="610.0" y2="151.0" stroke="#56554f" stroke-width="1.6" marker-end="url(#a)"/><rect x="614.0" y="120.0" width="238.0" height="62.0" rx="5" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.2"/><text x="625.0" y="138.0" font-size="9.5" fill="#a33a12" font-weight="600" text-anchor="start">JUDGE — SIEHT TOOL-OUTPUT + ANTWORT</text><text x="625.0" y="156.0" font-size="11.5" fill="#17171a" font-weight="500" text-anchor="start">„Perfectly Correct“</text><text x="625.0" y="172.0" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">Antwort passt zum Tool-Output.</text><text x="614.0" y="202.0" font-size="11.5" fill="#a33a12" font-weight="600" text-anchor="start">✗  Falsch — und niemand merkt es.</text><text x="28.0" y="252.0" font-size="12.5" fill="#17171a" font-weight="600" text-anchor="start">Judge mit Referenz</text><rect x="28.0" y="262.0" width="196.0" height="62.0" rx="5" fill="#ffffff" stroke="#dcdbd6" stroke-width="1.2"/><text x="39.0" y="280.0" font-size="9.5" fill="#82807a" font-weight="600" text-anchor="start">SQL DES AGENTEN</text><text x="39.0" y="298.0" font-size="11" fill="#17171a" font-weight="500" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">SUM(gross_revenue)</text><text x="39.0" y="314.0" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">brutto statt netto</text><line x1="226.0" y1="293.0" x2="234.0" y2="293.0" stroke="#56554f" stroke-width="1.6" marker-end="url(#a)"/><rect x="238.0" y="262.0" width="166.0" height="62.0" rx="5" fill="#ffffff" stroke="#dcdbd6" stroke-width="1.2"/><text x="249.0" y="280.0" font-size="9.5" fill="#82807a" font-weight="600" text-anchor="start">ATHENA</text><text x="249.0" y="298.0" font-size="11.5" fill="#17171a" font-weight="500" text-anchor="start">4,21 Mio. €</text><text x="249.0" y="314.0" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">korrekt ausgeführt</text><line x1="406.0" y1="293.0" x2="414.0" y2="293.0" stroke="#56554f" stroke-width="1.6" marker-end="url(#a)"/><rect x="418.0" y="262.0" width="182.0" height="62.0" rx="5" fill="#ffffff" stroke="#dcdbd6" stroke-width="1.2"/><text x="429.0" y="280.0" font-size="9.5" fill="#82807a" font-weight="600" text-anchor="start">ANTWORT</text><text x="429.0" y="298.0" font-size="11.5" fill="#17171a" font-weight="500" text-anchor="start">„Der Umsatz lag bei</text><text x="429.0" y="314.0" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">4,21 Mio. €.“</text><line x1="602.0" y1="293.0" x2="610.0" y2="293.0" stroke="#56554f" stroke-width="1.6" marker-end="url(#a)"/><rect x="614.0" y="262.0" width="238.0" height="62.0" rx="5" fill="#e6f7f0" stroke="#1baf7a" stroke-width="1.2"/><text x="625.0" y="280.0" font-size="9.5" fill="#0f7a56" font-weight="600" text-anchor="start">JUDGE — VERGLEICHT MIT GOLDEN SET</text><text x="625.0" y="298.0" font-size="11.5" fill="#17171a" font-weight="500" text-anchor="start">FAIL: 4,21 ≠ 3,58 Mio. €</text><text x="625.0" y="314.0" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">Ergebnis weicht von Referenz ab.</text><rect x="238.0" y="354.0" width="362.0" height="50.0" rx="5" fill="#ffffff" stroke="#1baf7a" stroke-width="1.2"/><text x="249.0" y="372.0" font-size="9.5" fill="#0f7a56" font-weight="600" text-anchor="start">GOLDEN SET — FACHLICH ABGENOMMEN</text><text x="249.0" y="390.0" font-size="11" fill="#17171a" font-weight="500" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">SUM(net_revenue)  →  3,58 Mio. €</text><path d="M 602 379 L 733.0 379 L 733.0 328" fill="none" stroke="#1baf7a" stroke-width="1.6" marker-end="url(#ag)"/><text x="741.0" y="368.0" font-size="11.5" fill="#0f7a56" font-weight="600" text-anchor="start">✓  Fehler erkannt</text><line x1="28.0" y1="428.0" x2="852.0" y2="428.0" stroke="#e7e6e1" stroke-width="1"/><text x="28.0" y="448.0" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="start">Built-in-Correctness in AgentCore Evaluations: „The tool output ALWAYS takes priority over your own knowledge.“ Ohne Referenz misst ein Judge Konsistenz, nicht Richtigkeit.</text></svg>