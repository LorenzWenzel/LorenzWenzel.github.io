<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Wie die Chunkgroesse den Vektor veraendert</title><desc id="d">Drei Panels. Links ein zu kleiner Chunk: der Vektor zeigt scharf auf ein Thema, aber der Bezug fehlt. Mitte ein passender Chunk: ein Thema, vollstaendig, der Vektor zeigt scharf auf das richtige Thema. Rechts ein zu grosser Chunk mit vier Themen: der Vektor ist der Mittelwert der vier Richtungen, er ist kurz und zeigt in keine der vier Richtungen.</desc><rect x="0" y="0" width="880" height="470" fill="#fcfcfb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56554f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dcdbd6"/></marker></defs><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Wie die Chunkgröße den Vektor verändert</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Der Vektor eines Chunks ist immer gleich lang — 1 536 Zahlen. Was sich ändert, ist wohin er zeigt.</text><rect x="52.0" y="110.0" width="196.0" height="196.0" rx="6" fill="#ffffff" stroke="#e7e6e1" stroke-width="1"/><circle cx="150.0" cy="208.0" r="76" fill="none" stroke="#e7e6e1" stroke-width="1" stroke-dasharray="3 4"/><text x="52" y="96" font-size="13" fill="#a33a12" font-weight="600" text-anchor="start">zu klein</text><rect x="342.0" y="110.0" width="196.0" height="196.0" rx="6" fill="#ffffff" stroke="#e7e6e1" stroke-width="1"/><circle cx="440.0" cy="208.0" r="76" fill="none" stroke="#e7e6e1" stroke-width="1" stroke-dasharray="3 4"/><text x="342" y="96" font-size="13" fill="#1baf7a" font-weight="600" text-anchor="start">passend</text><rect x="632.0" y="110.0" width="196.0" height="196.0" rx="6" fill="#ffffff" stroke="#e7e6e1" stroke-width="1"/><circle cx="730.0" cy="208.0" r="76" fill="none" stroke="#e7e6e1" stroke-width="1" stroke-dasharray="3 4"/><text x="632" y="96" font-size="13" fill="#a33a12" font-weight="600" text-anchor="start">zu groß</text><circle cx="150.0" cy="132.0" r="4" fill="#2a78d6"/><text x="150.0" y="122.5" font-size="9.5" fill="#2a78d6" font-weight="600" text-anchor="middle">Frist</text><circle cx="84.2" cy="246.0" r="3" fill="#82807a"/><text x="72.92373906318497" y="256.0" font-size="9.5" fill="#82807a" font-weight="400" text-anchor="end">Kündigung</text><circle cx="215.8" cy="246.0" r="3" fill="#82807a"/><text x="227.076260936815" y="256.00000000000006" font-size="9.5" fill="#82807a" font-weight="400" text-anchor="start">Miete</text><line x1="150.0" y1="208.0" x2="150.0" y2="140.0" stroke="#2a78d6" stroke-width="2.4" marker-end="url(#ab)"/><circle cx="150.0" cy="208.0" r="2.5" fill="#56554f"/><circle cx="402.0" cy="142.2" r="4" fill="#2a78d6"/><text x="395.5" y="134.42373906318494" font-size="9.5" fill="#2a78d6" font-weight="600" text-anchor="end">Kündigung §5</text><circle cx="414.0" cy="279.4" r="3" fill="#82807a"/><text x="409.5602072440155" y="295.13264324994583" font-size="9.5" fill="#82807a" font-weight="400" text-anchor="end">Miete</text><circle cx="514.8" cy="194.8" r="3" fill="#82807a"/><text x="527.6478900180865" y="196.0453121876432" font-size="9.5" fill="#82807a" font-weight="400" text-anchor="start">Kaution</text><line x1="440.0" y1="208.0" x2="406.0" y2="149.1" stroke="#2a78d6" stroke-width="2.4" marker-end="url(#ab)"/><circle cx="440.0" cy="208.0" r="2.5" fill="#56554f"/><circle cx="768.0" cy="142.2" r="3" fill="#82807a"/><text x="774.5" y="134.42373906318497" font-size="9.5" fill="#82807a" font-weight="400" text-anchor="start">Miete</text><line x1="730.0" y1="208.0" x2="763.0" y2="150.8" stroke="#dcdbd6" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="671.8" cy="159.1" r="3" fill="#82807a"/><text x="661.822044562411" y="154.291902737898" font-size="9.5" fill="#82807a" font-weight="400" text-anchor="end">Kaution</text><line x1="730.0" y1="208.0" x2="679.4" y2="165.6" stroke="#dcdbd6" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="667.7" cy="251.6" r="3" fill="#82807a"/><text x="657.0954680582797" y="262.54830283524313" font-size="9.5" fill="#82807a" font-weight="400" text-anchor="end">Kündigung</text><line x1="730.0" y1="208.0" x2="675.9" y2="245.9" stroke="#dcdbd6" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="768.0" cy="273.8" r="3" fill="#82807a"/><text x="774.5" y="288.57626093681506" font-size="9.5" fill="#82807a" font-weight="400" text-anchor="start">Schönheitsrep.</text><line x1="730.0" y1="208.0" x2="763.0" y2="265.2" stroke="#dcdbd6" stroke-width="1.4" stroke-dasharray="3 3"/><line x1="730.0" y1="208.0" x2="700.2" y2="204.5" stroke="#eb6834" stroke-width="2.4" marker-end="url(#ao)"/><circle cx="730.0" cy="208.0" r="2.5" fill="#56554f"/><text x="52" y="336" font-size="11" fill="#56554f" font-weight="400" text-anchor="start">»Die Frist beträgt drei</text><text x="52" y="352" font-size="11" fill="#56554f" font-weight="400" text-anchor="start">Monate zum Monatsende.«</text><text x="52" y="368" font-size="11" fill="#82807a" font-weight="400" text-anchor="start"></text><text x="52" y="384" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">Scharf — aber welche Frist,</text><text x="52" y="400" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">welcher Vertrag? Der Bezug</text><text x="52" y="416" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">stand im Satz davor.</text><text x="342" y="336" font-size="11" fill="#56554f" font-weight="400" text-anchor="start">Ein Thema, vollständig,</text><text x="342" y="352" font-size="11" fill="#56554f" font-weight="400" text-anchor="start">mit seiner Überschrift.</text><text x="342" y="368" font-size="11" fill="#82807a" font-weight="400" text-anchor="start"></text><text x="342" y="384" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">Der Vektor zeigt dorthin,</text><text x="342" y="400" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">wo auch die Frage</text><text x="342" y="416" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">hinzeigen wird.</text><text x="632" y="336" font-size="11" fill="#56554f" font-weight="400" text-anchor="start">Vier Themen in einem Chunk.</text><text x="632" y="352" font-size="11" fill="#56554f" font-weight="400" text-anchor="start"></text><text x="632" y="368" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">Der Vektor ist ihr Mittelwert:</text><text x="632" y="384" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">kurz, und er zeigt in keine</text><text x="632" y="400" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">der vier Richtungen. Nah bei</text><text x="632" y="416" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">allem, nah bei nichts.</text></svg>