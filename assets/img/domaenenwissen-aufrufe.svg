<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 362" width="880" height="362" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Modellaufrufe nach Ausloeser</title><desc id="d">Vier Varianten: A1 und A2 mit drei Modellaufrufen der SQL-Kette, B mit einem zusaetzlichen Wissensaufruf, C mit zwei.</desc><rect x="0" y="0" width="880" height="362" fill="#fcfcfb"/><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Wer löst welchen Modellaufruf aus?</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Die SQL-Suchkette ist in allen Varianten gleich. Was sich unterscheidet, sind die Aufrufe davor.</text><rect x="28" y="80" width="11" height="11" rx="2.5" fill="#eb6834"/><text x="45" y="90" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">durch Domänenwissen ausgelöst</text><rect x="260" y="80" width="11" height="11" rx="2.5" fill="#2a78d6"/><text x="277" y="90" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">durch die SQL-Suchkette ausgelöst</text><text x="28" y="127" font-size="13" fill="#17171a" font-weight="600" text-anchor="start">0  Alles in den Systemprompt</text><text x="28" y="143" font-size="11.5" fill="#82807a" font-weight="400" text-anchor="start">3 Modellaufrufe</text><rect x="250" y="112" width="102" height="34" rx="6" fill="#2a78d6"/><text x="301.0" y="134" font-size="11.5" fill="#ffffff" font-weight="500" text-anchor="middle">Abfrage bauen</text><path d="M354,125.5 L360,129.0 L354,132.5 Z" fill="#82807a"/><rect x="364" y="112" width="102" height="34" rx="6" fill="#2a78d6"/><text x="415.0" y="134" font-size="11.5" fill="#ffffff" font-weight="500" text-anchor="middle">Fehler beheben</text><path d="M468,125.5 L474,129.0 L468,132.5 Z" fill="#82807a"/><rect x="478" y="112" width="102" height="34" rx="6" fill="#2a78d6"/><text x="529.0" y="134" font-size="11.