<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Erst strukturieren, dann fragen</title><desc id="d">Oben die Ingestion: Vertrag geht in eine Extraktion (LLM oder Content Understanding) und wird zu einer typisierten Tabellenzeile mit Objekt, Einheit, Miete als Zahl, Indexierungsklausel als Ja/Nein und naechstem Indexierungsdatum. Unten die Abfrage: 'Welche Einheit hat die hoechste Miete?' wird zu orderby rent desc top 1, 'Wer kann in den naechsten zwei Wochen indexiert werden?' zu einem Datumsfilter. Kein Retrieval, kein Score.</desc><rect x="0" y="0" width="880" height="500" fill="#fcfcfb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56554f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dcdbd6"/></marker></defs><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Erst strukturieren, dann fragen</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Die Arbeit des Modells wandert vom Fragezeitpunkt zum Indexaufbau. Danach ist die Frage eine Abfrage.</text><text x="28" y="100" font-size="12" fill="#17171a" font-weight="600" text-anchor="start">Beim Indexaufbau — einmal pro Vertrag</text><rect x="28.0" y="114.0" width="160.0" height="54.0" rx="5" fill="#ffffff" stroke="#dcdbd6" stroke-width="1.2"/><text x="40" y="136" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="start">Mietvertrag GUT57</text><text x="40" y="154" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="start">18 Seiten, OCR-Text</text><line x1="192.0" y1="141.0" x2="226.0" y2="141.0" stroke="#56554f" stroke-width="1.8" marker-end="url(#a)"/><rect x="232.0" y="114.0" width="196.0" height="54.0" rx="5" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.2"/><text x="244" y="136" font-size="11.5" fill="#1c5cab" font-weight="600" text-anchor="start">Extraktion</text><text x="244" y="154" font-size="10.5" fill="#56554f" font-weight="400" text-anchor="start">LLM-Schema / Content Understanding</text><line x1="432.0" y1="141.0" x2="464.0" y2="141.0" stroke="#56554f" stroke-width="1.8" marker-end="url(#a)"/><rect x="470.0" y="106.0" width="382.0" height="72.0" rx="5" fill="#ffffff" stroke="#dcdbd6" stroke-width="1.2"/><text x="478.0" y="124" font-size="9" fill="#82807a" font-weight="500" text-anchor="start">property_code</text><text x="478.0" y="144" font-size="11" fill="#17171a" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,monospace">GUT57</text><text x="478.0" y="162" font-size="9" fill="#2a78d6" font-weight="500" text-anchor="start">String</text><text x="554.4" y="124" font-size="9" fill="#82807a" font-weight="500" text-anchor="start">unit</text><text x="554.4" y="144" font-size="11" fill="#17171a" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,monospace">WE 03.12</text><text x="554.4" y="162" font-size="9" fill="#2a78d6" font-weight="500" text-anchor="start">String</text><line x1="546.4" y1="110.0" x2="546.4" y2="174.0" stroke="#e7e6e1" stroke-width="1"/><text x="630.8" y="124" font-size="9" fill="#82807a" font-weight="500" text-anchor="start">rent</text><text x="630.8" y="144" font-size="11" fill="#17171a" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,monospace">1 250,00</text><text x="630.8" y="162" font-size="9" fill="#2a78d6" font-weight="500" text-anchor="start">Double</text><line x1="622.8" y1="110.0" x2="622.8" y2="174.0" stroke="#e7e6e1" stroke-width="1"/><text x="707.2" y="124" font-size="9" fill="#82807a" font-weight="500" text-anchor="start">index_clause</text><text x="707.2" y="144" font-size="11" fill="#17171a" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,monospace">true</text><text x="707.2" y="162" font-size="9" fill="#2a78d6" font-weight="500" text-anchor="start">Boolean</text><line x1="699.2" y1="110.0" x2="699.2" y2="174.0" stroke="#e7e6e1" stroke-width="1"/><text x="783.6" y="124" font-size="9" fill="#82807a" font-weight="500" text-anchor="start">next_index</text><text x="783.6" y="144" font-size="11" fill="#17171a" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,monospace">2026-09-20</text><text x="783.6" y="162" font-size="9" fill="#2a78d6" font-weight="500" text-anchor="start">DateTime</text><line x1="775.6" y1="110.0" x2="775.6" y2="174.0" stroke="#e7e6e1" stroke-width="1"/><text x="470" y="194" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="start">eine typisierte Zeile — Zahl ist Zahl, Datum ist Datum</text><text x="28" y="236" font-size="12" fill="#17171a" font-weight="600" text-anchor="start">Bei der Frage — ohne Retrieval, ohne Score</text><rect x="28.0" y="250.0" width="300.0" height="66.0" rx="5" fill="#ffffff" stroke="#dcdbd6" stroke-width="1.2"/><text x="40" y="274" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="start">„Welche Einheit hat</text><text x="40" y="292" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="start">die höchste Miete?“</text><line x1="332.0" y1="283.0" x2="362.0" y2="283.0" stroke="#56554f" stroke-width="1.8" marker-end="url(#a)"/><rect x="366.0" y="250.0" width="320.0" height="66.0" rx="5" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.2"/><text x="378" y="276" font-size="10.5" fill="#a33a12" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,monospace">search=*</text><text x="378" y="294" font-size="10.5" fill="#a33a12" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,monospace">$orderby=rent desc</text><text x="378" y="312" font-size="10.5" fill="#a33a12" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,monospace">$top=1</text><line x1="690.0" y1="283.0" x2="720.0" y2="283.0" stroke="#56554f" stroke-width="1.8" marker-end="url(#a)"/><rect x="724.0" y="250.0" width="128.0" height="66.0" rx="5" fill="#ffffff" stroke="#dcdbd6" stroke-width="1.2"/><text x="736" y="276" font-size="10.5" fill="#17171a" font-weight="500" text-anchor="start">WE 03.12</text><text x="736" y="294" font-size="10.5" fill="#17171a" font-weight="500" text-anchor="start">1 250,00 €</text><rect x="28.0" y="332.0" width="300.0" height="66.0" rx="5" fill="#ffffff" stroke="#dcdbd6" stroke-width="1.2"/><text x="40" y="356" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="start">„Bei wem kann ich in zwei</text><text x="40" y="374" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="start">Wochen indexieren?“</text><line x1="332.0" y1="365.0" x2="362.0" y2="365.0" stroke="#56554f" stroke-width="1.8" marker-end="url(#a)"/><rect x="366.0" y="332.0" width="320.0" height="66.0" rx="5" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.2"/><text x="378" y="358" font-size="10.5" fill="#a33a12" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,monospace">search=*</text><text x="378" y="376" font-size="10.5" fill="#a33a12" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,monospace">$filter=next_index ge heute</text><text x="378" y="394" font-size="10.5" fill="#a33a12" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,monospace">  and next_index le heute+14d</text><line x1="690.0" y1="365.0" x2="720.0" y2="365.0" stroke="#56554f" stroke-width="1.8" marker-end="url(#a)"/><rect x="724.0" y="332.0" width="128.0" height="66.0" rx="5" fill="#ffffff" stroke="#dcdbd6" stroke-width="1.2"/><text x="736" y="358" font-size="10.5" fill="#17171a" font-weight="500" text-anchor="start">3 Verträge</text><text x="736" y="376" font-size="10.5" fill="#17171a" font-weight="500" text-anchor="start">GUT57, SOD118, LU10</text><text x="28" y="422" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="start">Dieselbe Frage im Vektorraum: „Miete“ steht in jedem Vertrag, die Zahl 1 250 ist für BM25 nicht suchbar und für das Embedding nicht ordnenbar.</text><text x="28" y="438" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="start">Und „2026-09-20“ steht in keinem Chunk — es ist eine Rechnung aus Mietbeginn und Intervall, keine Textstelle.</text></svg>