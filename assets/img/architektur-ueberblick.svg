<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Architektur des text2SQL-Agenten im Überblick</title><desc id="d">Der Nutzer fragt den Chatbot. Der Chatbot ruft Amazon Bedrock für das Modell auf und den MCP-Server für Werkzeuge. Der MCP-Server führt SQL auf Amazon Athena aus, Athena liest aus Amazon S3.</desc><rect x="0" y="0" width="900" height="424" fill="#fcfcfb"/><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Der Agent im Überblick</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Eine Frage geht hinein, eine Antwort kommt heraus – dazwischen denkt ein Modell und arbeiten Werkzeuge.</text><rect x="28" y="80" width="11" height="11" rx="2.5" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.4"/><text x="45" y="90" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">selbst betrieben</text><rect x="176" y="80" width="11" height="11" rx="2.5" fill="#ffffff" stroke="#d8d7d1" stroke-width="1.2"/><text x="193" y="90" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">verwalteter AWS-Dienst</text><rect x="28" y="118" width="120" height="84" rx="9" fill="#ffffff" stroke="#d8d7d1" stroke-width="1.2"/><text x="88.0" y="152" font-size="13.5" fill="#17171a" font-weight="600" text-anchor="middle">Nutzer</text><text x="88.0" y="173" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="middle">stellt die Frage</text><rect x="214" y="118" width="186" height="84" rx="9" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.6"/><text x="307.0" y="152" font-size="13.5" fill="#17171a" font-weight="600" text-anchor="middle">Chatbot</text><text x="307.0" y="173" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="middle">Oberfläche + Orchestrierung</text><rect x="486" y="118" width="186" height="84" rx="9" fill="#ffffff" stroke="#d8d7d1" stroke-width="1.2"/><text x="579.0" y="152" font-size="13.5" fill="#17171a" font-weight="600" text-anchor="middle">Amazon Bedrock</text><text x="579.0" y="173" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="middle">Claude – das Modell</text><rect x="214" y="262" width="186" height="84" rx="9" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.6"/><text x="307.0" y="296" font-size="13.5" fill="#17171a" font-weight="600" text-anchor="middle">MCP-Server</text><text x="307.0" y="317" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="middle">Werkzeuge, z. B. run_query</text><rect x="486" y="262" width="186" height="84" rx="9" fill="#ffffff" stroke="#d8d7d1" stroke-width="1.2"/><text x="579.0" y="296" font-size="13.5" fill="#17171a" font-weight="600" text-anchor="middle">Amazon Athena</text><text x="579.0" y="317" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="middle">führt das SQL aus</text><rect x="740" y="262" width="132" height="84" rx="9" fill="#ffffff" stroke="#d8d7d1" stroke-width="1.2"/><text x="806.0" y="296" font-size="13.5" fill="#17171a" font-weight="600" text-anchor="middle">Amazon S3</text><text x="806.0" y="317" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="middle">Data Lake</text><line x1="148" y1="160.0" x2="207" y2="160.0" stroke="#82807a" stroke-width="1.6"/><path d="M207,155.5 L214,160.0 L207,164.5 Z" fill="#82807a"/><text x="181.0" y="151.0" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">Frage</text><line x1="407" y1="160.0" x2="479" y2="160.0" stroke="#82807a" stroke-width="1.6"/><path d="M479,155.5 L486,160.0 L479,164.5 Z" fill="#82807a"/><path d="M407,155.5 L400,160.0 L407,164.5 Z" fill="#82807a"/><text x="443.0" y="151.0" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">Modellaufruf</text><line x1="400" y1="304.0" x2="479" y2="304.0" stroke="#82807a" stroke-width="1.6"/><path d="M479,299.5 L486,304.0 L479,308.5 Z" fill="#82807a"/><text x="443.0" y="295.0" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">SQL</text><line x1="672" y1="304.0" x2="733" y2="304.0" stroke="#82807a" stroke-width="1.6"/><path d="M733,299.5 L740,304.0 L733,308.5 Z" fill="#82807a"/><text x="706.0" y="295.0" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">liest</text><line x1="307.0" y1="202" x2="307.0" y2="255" stroke="#82807a" stroke-width="1.6"/><path d="M302.5,255 L307.0,262 L311.5,255 Z" fill="#82807a"/><text x="319.0" y="230" font-size="11" fill="#56554f" font-weight="400" text-anchor="start">Tool-Aufruf</text><text x="28" y="398" font-size="11.5" fill="#82807a" font-weight="400" text-anchor="start">Stark vereinfacht: Kubernetes, VPC und Subnetze, IAM-Rollen, der Glue Data Catalog und Lake Formation sind weggelassen.</text></svg>