<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 442" width="900" height="442" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Architektur des text2SQL-Agenten im Überblick</title><desc id="d">Der Nutzer fragt den Chatbot. Chatbot und MCP-Server laufen im eigenen Betrieb. Der Chatbot ruft Amazon Bedrock für das Modell auf und den MCP-Server für Werkzeuge. Der MCP-Server führt SQL auf Amazon Athena aus, Athena liest aus Amazon S3. Bedrock, Athena und S3 liegen in der AWS Cloud.</desc><rect x="0" y="0" width="900" height="442" fill="#ffffff"/><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Der Agent im Überblick</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Eine Frage geht hinein, eine Antwort kommt heraus – dazwischen denkt ein Modell und arbeiten Werkzeuge.</text><rect x="170" y="106" width="186" height="285" rx="6" fill="none" stroke="#7D8998" stroke-width="1.5"/><text x="182" y="127" font-size="11.5" fill="#7D8998" font-weight="600" text-anchor="start">Eigener Betrieb</text><rect x="470" y="106" width="408" height="285" rx="6" fill="none" stroke="#232F3E" stroke-width="1.5"/><g transform="translate(482,110)"><path d="M5,14 a4.5,4.5 0 0 1 1,-8.8 a6,6 0 0 1 11.4,1.2 a4,4 0 0 1 -0.6,7.6 z" fill="#232F3E"/></g><text x="508" y="127" font-size="11.5" fill="#232F3E" font-weight="600" text-anchor="start">AWS Cloud</text><g transform="translate(44.0,146)"><g fill="none" stroke="#232F3E" stroke-width="2.6" stroke-linecap="round"><circle cx="26" cy="17" r="7.5"/><path d="M12,43 C12,31.5 40,31.5 40,43"/></g></g><text x="70" y="217" font-size="13" fill="#17171a" font-weight="600" text-anchor="middle">Nutzer</text><text x="70" y="234" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">stellt die Frage</text><g transform="translate(236.0,146)"><rect width="52" height="52" rx="9" fill="#232F3E"/><path d="M12,15 H40 a5,5 0 0 1 5,5 V33 a5,5 0 0 1 -5,5 H26 l-9,7 v-7 h-5 a5,5 0 0 1 -5,-5 V20 a5,5 0 0 1 5,-5 z" fill="#ffffff"/><circle cx="19" cy="26.5" r="2.4" fill="#232F3E"/><circle cx="26" cy="26.5" r="2.4" fill="#232F3E"/><circle cx="33" cy="26.5" r="2.4" fill="#232F3E"/></g><text x="262" y="217" font-size="13" fill="#17171a" font-weight="600" text-anchor="middle">Chatbot</text><text x="262" y="234" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">Oberfläche + Orchestrierung</text><g transform="translate(236.0,292)"><rect width="52" height="52" rx="9" fill="#232F3E"/><rect x="11" y="12.5" width="30" height="8.5" rx="2.5" fill="#ffffff"/><circle cx="16" cy="16.75" r="1.7" fill="#232F3E"/><rect x="11" y="23" width="30" height="8.5" rx="2.5" fill="#ffffff"/><circle cx="16" cy="27.25" r="1.7" fill="#232F3E"/><rect x="11" y="33.5" width="30" height="8.5" rx="2.5" fill="#ffffff"/><circle cx="16" cy="37.75" r="1.7" fill="#232F3E"/></g><text x="262" y="363" font-size="13" fill="#17171a" font-weight="600" text-anchor="middle">MCP-Server</text><text x="262" y="380" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">Werkzeuge, z. B. run_query</text><g transform="translate(648.0,146)"><rect width="52" height="52" rx="9" fill="#01A88D"/><g stroke="#ffffff" stroke-width="1.8"><line x1="26" y1="26" x2="14" y2="15"/><line x1="26" y1="26" x2="38" y2="15"/><line x1="26" y1="26" x2="14" y2="37"/><line x1="26" y1="26" x2="38" y2="37"/></g><circle cx="26" cy="26" r="5" fill="#ffffff"/><circle cx="14" cy="15" r="3.4" fill="#ffffff"/><circle cx="38" cy="15" r="3.4" fill="#ffffff"/><circle cx="14" cy="37" r="3.4" fill="#ffffff"/><circle cx="38" cy="37" r="3.4" fill="#ffffff"/></g><text x="674" y="217" font-size="13" fill="#17171a" font-weight="600" text-anchor="middle">Amazon Bedrock</text><text x="674" y="234" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">Claude – das Modell</text><g transform="translate(544.0,292)"><rect width="52" height="52" rx="9" fill="#8C4FFF"/><circle cx="23" cy="23" r="10.5" fill="none" stroke="#ffffff" stroke-width="2.6"/><g stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"><line x1="17.5" y1="19.5" x2="28.5" y2="19.5"/><line x1="17.5" y1="23" x2="28.5" y2="23"/><line x1="17.5" y1="26.5" x2="24.5" y2="26.5"/></g><line x1="30.5" y1="30.5" x2="39.5" y2="39.5" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/></g><text x="570" y="363" font-size="13" fill="#17171a" font-weight="600" text-anchor="middle">Amazon Athena</text><text x="570" y="380" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">führt das SQL aus</text><g transform="translate(764.0,292)"><rect width="52" height="52" rx="9" fill="#7AA116"/><path d="M12.5,16 L16.6,37.8 Q26,42.6 35.4,37.8 L39.5,16 Z" fill="#ffffff"/><ellipse cx="26" cy="16" rx="13.5" ry="4.9" fill="#ffffff"/><ellipse cx="26" cy="16" rx="9.3" ry="3.1" fill="#7AA116"/></g><text x="790" y="363" font-size="13" fill="#17171a" font-weight="600" text-anchor="middle">Amazon S3</text><text x="790" y="380" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">Data Lake</text><line x1="96" y1="172.0" x2="228" y2="172.0" stroke="#5A6570" stroke-width="1.7"/><path d="M228,167.0 L236,172.0 L228,177.0 Z" fill="#5A6570"/><text x="132" y="163.0" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">Frage</text><line x1="296" y1="172.0" x2="640" y2="172.0" stroke="#5A6570" stroke-width="1.7"/><path d="M640,167.0 L648,172.0 L640,177.0 Z" fill="#5A6570"/><path d="M296,167.0 L288,172.0 L296,177.0 Z" fill="#5A6570"/><text x="413" y="163.0" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">Modellaufruf</text><line x1="288" y1="318.0" x2="536" y2="318.0" stroke="#5A6570" stroke-width="1.7"/><path d="M536,313.0 L544,318.0 L536,323.0 Z" fill="#5A6570"/><text x="413" y="309.0" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">SQL</text><line x1="596" y1="318.0" x2="756" y2="318.0" stroke="#5A6570" stroke-width="1.7"/><path d="M756,313.0 L764,318.0 L756,323.0 Z" fill="#5A6570"/><text x="680" y="309.0" font-size="11" fill="#56554f" font-weight="400" text-anchor="middle">liest</text><line x1="262" y1="243" x2="262" y2="284" stroke="#5A6570" stroke-width="1.7"/><path d="M257,284 L262,292 L267,284 Z" fill="#5A6570"/><text x="274" y="270" font-size="11" fill="#56554f" font-weight="400" text-anchor="start">Tool-Aufruf</text><text x="28" y="420" font-size="11.5" fill="#82807a" font-weight="400" text-anchor="start">Stark vereinfacht: Kubernetes, VPC und Subnetze, IAM-Rollen, der Glue Data Catalog und Lake Formation sind weggelassen.</text></svg>