<text x="28" y="486" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">Der Unterschied liegt nicht in der Qualität der Suche, sondern in der Frage: Links steht die Antwort in einem Chunk.</text><text x="28" y="502" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">Rechts steht sie in keinem — sie entsteht erst aus dem Vergleich aller zwölf.</text></svg>