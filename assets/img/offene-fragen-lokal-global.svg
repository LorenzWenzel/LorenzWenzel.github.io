<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Lokale und globale Fragen</title><desc id="d">Zwei Raster aus zwoelf Vertraegen mal sechs Paragraphen. Links die lokale Frage 'Was steht in Paragraph 5 von GUT57?': genau eine Zelle leuchtet, Top-k findet sie. Rechts die globale Frage 'Welche Einheit hat die hoechste Miete?': in allen zwoelf Vertraegen leuchtet Paragraph 3, alle mit aehnlichem Score. Top-3 greift drei davon heraus -- eine Stichprobe, keine Antwort.</desc><rect x="0" y="0" width="880" height="540" fill="#fcfcfb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56554f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dcdbd6"/></marker></defs><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Lokale und globale Fragen</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Zwölf Mietverträge, je sechs Paragraphen. Welche Chunks für die Frage in Frage kommen.</text><text x="54" y="102" font-size="12.5" fill="#17171a" font-weight="600" text-anchor="start">„Was steht in § 5 von GUT57?“</text><text x="54" y="143.0" font-size="10" fill="#82807a" font-weight="400" text-anchor="end">§ 1</text><rect x="62.0" y="124.0" width="24.0" height="30.0" rx="3" fill="#