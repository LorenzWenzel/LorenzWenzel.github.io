<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Mehr Dimensionen sind nicht gleich besser</title><desc id="d">Gruppiertes Balkendiagramm mit drei Embedding-Modellen und zwei Benchmarks. MTEB englisch: ada-002 61,0, 3-small 62,3, 3-large 64,6. MIRACL mehrsprachig: ada-002 31,4, 3-small 44,0, 3-large 54,9. Der Abstand zwischen den Modellen ist auf dem mehrsprachigen Benchmark um ein Vielfaches groesser als auf dem englischen. Darunter eine Zeile mit Dimensionen und Speicherbedarf pro 10 000 Chunks.</desc><rect x="0" y="0" width="880" height="500" fill="#fcfcfb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56554f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dcdbd6"/></marker></defs><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Mehr Dimensionen sind nicht gleich besser</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Veröffentlichte Benchmarkwerte der drei Azure-OpenAI-Embeddingmodelle. Höher ist besser.</text><line x1="96.0" y1="338.0" x2="700.0" y2="338.0" stroke="#e7e6e1" stroke-width="1"/><text x="86" y="342.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">0</text><line x1="96.0" y1="283.0" x2="700.0" y2="283.0" stroke="#e7e6e1" stroke-width="1"/><text x="86" y="287.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">20</text><line x1="96.0" y1="228.0" x2="700.0" y2="228.0" stroke="#e7e6e1" stroke-width="1"/><text x="86" y="232.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">40</text><line x1="96.0" y1="173.0" x2="700.0" y2="173.0" stroke="#e7e6e1" stroke-width="1"/><text x="86" y="177.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">60</text><line x1="96.0" y1="118.0" x2="700.0" y2="118.0" stroke="#e7e6e1" stroke-width="1"/><text x="86" y="122.0" font-size="11" fill="#82807a" font-weight="400" text-anchor="end">80</text><rect x="141.7" y="170.2" width="52.0" height="167.8" rx="4" fill="#2a78d6"/><text x="167.66666666666669" y="162.25" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">61,0</text><rect x="199.7" y="251.7" width="52.0" height="86.3" rx="4" fill="#eb6834"/><text x="225.66666666666669" y="243.65" font-size="11.5" fill="#eb6834" font-weight="600" text-anchor="middle">31,4</text><text x="196.66666666666669" y="358" font-size="11.5" fill="#56554f" font-weight="500" text-anchor="middle">text-embedding-</text><text x="196.66666666666669" y="372" font-size="11.5" fill="#56554f" font-weight="500" text-anchor="middle">ada-002</text><rect x="343.0" y="166.7" width="52.0" height="171.3" rx="4" fill="#2a78d6"/><text x="369.00000000000006" y="158.675" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">62,3</text><rect x="401.0" y="217.0" width="52.0" height="121.0" rx="4" fill="#eb6834"/><text x="427.00000000000006" y="209.0" font-size="11.5" fill="#eb6834" font-weight="600" text-anchor="middle">44,0</text><text x="398.00000000000006" y="358" font-size="11.5" fill="#56554f" font-weight="500" text-anchor="middle">text-embedding-</text><text x="398.00000000000006" y="372" font-size="11.5" fill="#56554f" font-weight="500" text-anchor="middle">3-small</text><rect x="544.3" y="160.4" width="52.0" height="177.6" rx="4" fill="#2a78d6"/><text x="570.3333333333334" y="152.35000000000002" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">64,6</text><rect x="602.3" y="187.0" width="52.0" height="151.0" rx="4" fill="#eb6834"/><text x="628.3333333333334" y="179.025" font-size="11.5" fill="#eb6834" font-weight="600" text-anchor="middle">54,9</text><text x="599.3333333333334" y="358" font-size="11.5" fill="#56554f" font-weight="500" text-anchor="middle">text-embedding-</text><text x="599.3333333333334" y="372" font-size="11.5" fill="#56554f" font-weight="500" text-anchor="middle">3-large</text><line x1="96.0" y1="338.0" x2="700.0" y2="338.0" stroke="#dcdbd6" stroke-width="1.2"/><rect x="716.0" y="126.0" width="12.0" height="12.0" rx="3" fill="#2a78d6"/><text x="734" y="136" font-size="11.5" fill="#56554f" font-weight="500" text-anchor="start">MTEB</text><text x="734" y="150" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="start">englisch</text><rect x="716.0" y="170.0" width="12.0" height="12.0" rx="3" fill="#eb6834"/><text x="734" y="180" font-size="11.5" fill="#56554f" font-weight="600" text-anchor="start">MIRACL</text><text x="734" y="194" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="start">mehrsprachig</text><text x="716" y="224" font-size="10.8" fill="#56554f" font-weight="500" text-anchor="start">Bei deutschen</text><text x="716" y="238" font-size="10.8" fill="#56554f" font-weight="500" text-anchor="start">Verträgen zählt</text><text x="716" y="252" font-size="10.8" fill="#56554f" font-weight="500" text-anchor="start">die orange Reihe.</text><line x1="28.0" y1="392.0" x2="852.0" y2="392.0" stroke="#e7e6e1" stroke-width="1"/><text x="28" y="414" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="start">Dimensionen</text><text x="196.66666666666669" y="414" font-size="11.5" fill="#56554f" font-weight="500" text-anchor="middle">1 536</text><text x="196.66666666666669" y="434" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="middle">≈ 59 MB je 10 000 Chunks</text><text x="398.00000000000006" y="414" font-size="11.5" fill="#56554f" font-weight="500" text-anchor="middle">1 536</text><text x="398.00000000000006" y="434" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="middle">≈ 59 MB je 10 000 Chunks</text><text x="599.3333333333334" y="414" font-size="11.5" fill="#56554f" font-weight="500" text-anchor="middle">3 072</text><text x="599.3333333333334" y="434" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="middle">≈ 117 MB je 10 000 Chunks</text><text x="28" y="434" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="start">Vektorspeicher</text><text x="28" y="468" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">Beide 3er-Modelle lassen sich per dimensions-Parameter kürzen — laut OpenAI schlägt 3-large auf 256 Dimensionen noch ada-002 auf 1 536.</text></svg>