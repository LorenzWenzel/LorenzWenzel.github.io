<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Vier Arten, denselben Vertrag zu schneiden</title><desc id="d">Vier Spalten nebeneinander zeigen denselben Mietvertrag mit sechs Paragraphen, viermal unterschiedlich in Chunks geschnitten: feste Tokenzahl mit gleich grossen Chunks und Schnitten mitten im Satz, Schnitt am Paragraphen mit sehr ungleich grossen Chunks, semantischer Schnitt am Themenwechsel, und hierarchischer Schnitt mit kleinen Kind-Chunks fuer die Suche und grossen Eltern-Chunks fuer die Antwort.</desc><rect x="0" y="0" width="880" height="560" fill="#fcfcfb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56554f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dcdbd6"/></marker></defs><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Vier Arten, denselben Vertrag zu schneiden</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Derselbe Mietvertrag mit sechs Paragraphen. Die Farbblöcke sind die Chunks, die im Index landen.</text><line x1="33.0" y1="112.0" x2="38.0" y2="112.0" stroke="#82807a" stroke-width="1"/><text x="29" y="121.0" font-size="9.5" fill="#82807a" font-weight="400" text-anchor="end">§ 1</text><line x1="33.0" y1="132.4" x2="38.