ext x="665" y="255.32" font-size="9.5" fill="#82807a" font-weight="400" text-anchor="end">§ 4</text><line x1="669.0" y1="266.8" x2="674.0" y2="266.8" stroke="#82807a" stroke-width="1"/><text x="665" y="275.76" font-size="9.5" fill="#82807a" font-weight="400" text-anchor="end">§ 5</text><line x1="669.0" y1="345.6" x2="674.0" y2="345.6" stroke="#82807a" stroke-width="1"/><text x="665" y="354.6" font-size="9.5" fill="#82807a" font-weight="400" text-anchor="end">§ 6</text><rect x="676.0" y="113.5" width="73.9" height="17.4" rx="3" fill="#d5e6fb" stroke="#2a78d6" stroke-width="1.1"/><rect x="676.0" y="133.9" width="73.9" height="32.0" rx="3" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.1"/><rect x="676.0" y="169.0" width="73.9" height="23.3" rx="3" fill="#d5e6fb" stroke="#2a78d6" stroke-width="1.1"/><rect x="676.0" y="195.3" width="73.9" height="23.3" rx="3" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.1"/><rect x="676.0" y="221.5" width="73.9" height="23.3" rx="3" fill="#d5e6fb" stroke="#2a78d6" stroke-width="1.1"/><rect x="676.0" y="247.8" width="73.9" height="17.4" rx="3" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.1"/><rect x="676.0" y="268.3" width="73.9" height="23.3" rx="3" fill="#d5e6fb" stroke="#2a78d6" stroke-width="1.1"/><rect x="676.0" y="294.5" width="73.9" height="23.3" rx="3" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.1"/><rect x="676.0" y="320.8" width="73.9" height="23.3" rx="3" fill="#d5e6fb" stroke="#2a78d6" stroke-width="1.1"/><rect x="676.0" y="347.1" width="73.9" height="26.2" rx="3" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.1"/><rect x="676.0" y="376.3" width="73.9" height="26.2" rx="3" fill="#d5e6fb" stroke="#2a78d6" stroke-width="1.1"/><rect x="760.5" y="113.5" width="47.5" height="131.3" rx="3" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.4"/><text x="784.24" y="182.16" font-size="9.5" fill="#a33a12" font-weight="600" text-anchor="middle">Eltern 1</text><rect x="760.5" y="247.8" width="47.5" height="154.7" rx="3" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.4"/><text x="784.24" y="328.15999999999997" font-size="9.5" fill="#a33a12" font-weight="600" text-anchor="middle">Eltern 2</text><text x="664" y="103" font-size="9.5" fill="#82807a" font-weight="400" text-anchor="start">Kind        Eltern</text><text x="28" y="90" font-size="13" fill="#17171a" font-weight="600" text-anchor="start">Feste Tokenzahl</text><text x="28" y="432" font-size="11" fill="#56554f" font-weight="400" text-anchor="start">Gleich große Chunks, berechenbar.</text><text x="28" y="448" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">Der Schnitt fällt dahin, wo</text><text x="28" y="464" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">der Zähler steht — auch mitten</text><text x="28" y="480" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">in einen Satz.</text><text x="240" y="90" font-size="13" fill="#17171a" font-weight="600" text-anchor="start">Schnitt am §</text><text x="240" y="432" font-size="11" fill="#56554f" font-weight="400" text-anchor="start">Folgt der Struktur des Vertrags.</text><text x="240" y="448" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">Aber § 1 hat 40 Token und § 3</text><text x="240" y="464" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">hat 1 900. Die Größen laufen</text><text x="240" y="480" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">weit auseinander.</text><text x="452" y="90" font-size="13" fill="#17171a" font-weight="600" text-anchor="start">Semantisch</text><text x="452" y="432" font-size="11" fill="#56554f" font-weight="400" text-anchor="start">Schnitt dort, wo das Thema</text><text x="452" y="448" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">wechselt — auch innerhalb eines §.</text><text x="452" y="464" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">Kostet beim Indexaufbau einen</text><text x="452" y="480" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">Embedding-Aufruf pro Satz.</text><text x="664" y="90" font-size="13" fill="#17171a" font-weight="600" text-anchor="start">Hierarchisch</text><text x="664" y="432" font-size="11" fill="#56554f" font-weight="400" text-anchor="start">Kleine Chunks für die Suche,</text><text x="664" y="448" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">großer Eltern-Chunk für die Antwort.</text><text x="664" y="464" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">Gefunden wird fein, geliefert</text><text x="664" y="480" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">wird im Zusammenhang.</text><line x1="28.0" y1="522.0" x2="852.0" y2="522.0" stroke="#e7e6e1" stroke-width="1"/><text x="28" y="540" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">Orange = Stelle, an der die Methode gegen die Struktur des Dokuments arbeitet.</text></svg>