<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Drei Wege und ihr Preis</title><desc id="d">Eine Frage geht in einen Router. Drei Wege: Retrieval fuer lokale Fragen mit einem Modellaufruf pro Frage; Strukturabfrage fuer vorhergesehene globale Fragen mit null bis einem Modellaufruf; Map-Reduce ueber alle Vertraege fuer unvorhergesehene globale Fragen mit n plus eins Modellaufrufen. Darunter die Kosten je Frage.</desc><rect x="0" y="0" width="880" height="470" fill="#fcfcfb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56554f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dcdbd6"/></marker></defs><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Drei Wege — und was sie pro Frage kosten</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Der Router ist selbst ein Modellaufruf oder ein Werkzeugaufruf: Das Modell wählt den Weg, nicht der Nutzer.</text><rect x="28.0" y="110.0" width="150.0" height="50.0" rx="5" fill="#ffffff" stroke="#dcdbd6" stroke-width="1.2"/><text x="40" y="132" font-size="11.5" fill="#17171a" font-weight="600" text-anchor="start">Frage</text><text x="40" y="150" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="start">beliebig formuliert</text><line x1="182.0" y1="135.0" x2="214.0" y2="135.0" stroke="#56554f" stroke-width="1.8" marker-end="url(#a)"/><rect x="218.0" y="110.0" width="130.0" height="50.0" rx="5" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.2"/><text x="230" y="132" font-size="11.5" fill="#1c5cab" font-weight="600" text-anchor="start">Router</text><text x="230" y="150" font-size="10.5" fill="#56554f" font-weight="400" text-anchor="start">lokal oder global?</text><path d="M 352 135 C 388 135, 360 136.0, 394 136.0" fill="none" stroke="#dcdbd6" stroke-width="1.6" marker-end="url(#am)"/><rect x="400.0" y="92.0" width="452.0" height="88.0" rx="6" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.3"/><text x="414" y="116" font-size="12" fill="#1c5cab" font-weight="600" text-anchor="start">A  Retrieval → Modell</text><text x="414" y="136" font-size="10.5" fill="#56554f" font-weight="400" text-anchor="start">Lokale Frage. Hybrid-Suche, Reranker, Top-k ins Prompt.</text><text x="414" y="152" font-size="10.5" fill="#56554f" font-weight="400" text-anchor="start">Die Antwort steht in einem Chunk.</text><rect x="702.0" y="100.0" width="138.0" height="20.0" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1"/><text x="771" y="114" font-size="10.5" fill="#1c5cab" font-weight="600" text-anchor="middle">1 Aufruf je Frage</text><path d="M 352 135 C 388 135, 360 240.0, 394 240.0" fill="none" stroke="#dcdbd6" stroke-width="1.6" marker-end="url(#am)"/><rect x="400.0" y="196.0" width="452.0" height="88.0" rx="6" fill="#e6f7f0" stroke="#1baf7a" stroke-width="1.3"/><text x="414" y="220" font-size="12" fill="#0f7a56" font-weight="600" text-anchor="start">B  Strukturabfrage → Modell formuliert</text><text x="414" y="240" font-size="10.5" fill="#56554f" font-weight="400" text-anchor="start">Globale Frage, die das Schema vorgesehen hat.</text><text x="414" y="256" font-size="10.5" fill="#56554f" font-weight="400" text-anchor="start">$filter / $orderby / Aggregation, das Modell schreibt nur den Satz.</text><rect x="702.0" y="204.0" width="138.0" height="20.0" rx="4" fill="#ffffff" stroke="#1baf7a" stroke-width="1"/><text x="771" y="218" font-size="10.5" fill="#0f7a56" font-weight="600" text-anchor="middle">0–1 Aufruf je Frage</text><path d="M 352 135 C 388 135, 360 344.0, 394 344.0" fill="none" stroke="#dcdbd6" stroke-width="1.6" marker-end="url(#am)"/><rect x="400.0" y="300.0" width="452.0" height="88.0" rx="6" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.3"/><text x="414" y="324" font-size="12" fill="#a33a12" font-weight="600" text-anchor="start">C  Map-Reduce über alle Verträge</text><text x="414" y="344" font-size="10.5" fill="#56554f" font-weight="400" text-anchor="start">Globale Frage, die das Schema nicht kennt. Je Vertrag: holen,</text><text x="414" y="360" font-size="10.5" fill="#56554f" font-weight="400" text-anchor="start">extrahieren. Dann ein Aufruf, der die n Ergebnisse vergleicht.</text><rect x="702.0" y="308.0" width="138.0" height="20.0" rx="4" fill="#ffffff" stroke="#eb6834" stroke-width="1"/><text x="771" y="322" font-size="10.5" fill="#a33a12" font-weight="600" text-anchor="middle">n + 1 Aufrufe je Frage</text><line x1="28.0" y1="410.0" x2="852.0" y2="410.0" stroke="#e7e6e1" stroke-width="1"/><text x="28" y="430" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">Bei 14 Verträgen ist Weg C bezahlbar. Bei 1 400 nicht mehr — dann muss die Frage entweder ins Schema (B) oder sie bleibt offen.</text><text x="28" y="448" font-size="11" fill="#82807a" font-weight="400" text-anchor="start">Die Kunst liegt darin, die häufigen globalen Fragen vorherzusehen und ins Schema zu nehmen, bevor jemand sie stellt.</text></svg>