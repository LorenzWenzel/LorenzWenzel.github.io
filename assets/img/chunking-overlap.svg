<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 414" width="880" height="414" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Was Overlap rettet und was er kostet</title><desc id="d">Oben ohne Overlap: ein Satz wird von der Chunkgrenze zerschnitten, Chunk A endet mit 'Die Kuendigungsfrist betraegt', Chunk B beginnt mit 'drei Monate zum Monatsende'. Keiner der beiden Chunks beantwortet die Frage. Unten mit 100 Token Overlap: Chunk B beginnt mit dem Ende von Chunk A und enthaelt den ganzen Satz. Rechts der Preis: der Index waechst um den Overlap-Anteil, im POC um 12,5 Prozent, bei der Microsoft-Empfehlung um 25 Prozent.</desc><rect x="0" y="0" width="880" height="414" fill="#fcfcfb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56554f"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dcdbd6"/></marker></defs><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Was Overlap rettet — und was er kostet</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Frage: „Wie lang ist die Kündigungsfrist?“ Der Satz mit der Antwort liegt genau auf der Chunkgrenze.</text><text x="28" y="104" font-size="13" fill="#17171a" font-weight="600" text-anchor="start">Ohne Overlap</text><rect x="40.0" y="118.0" width="246.0" height="58.0" rx="4" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.2"/><rect x="40.0" y="118.0" width="246.0" height="58.0" rx="4" fill="none" stroke="#2a78d6" stroke-width="1.2"/><text x="52" y="138" font-size="10" fill="#2a78d6" font-weight="600" text-anchor="start">Chunk A (Ende)</text><text x="52" y="156" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">… Das Mietverhältnis endet durch</text><text x="52" y="171" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">Kündigung. Die Kündigungsfrist beträgt</text><rect x="312.0" y="118.0" width="246.0" height="58.0" rx="4" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.2"/><rect x="312.0" y="118.0" width="246.0" height="58.0" rx="4" fill="none" stroke="#2a78d6" stroke-width="1.2"/><text x="324" y="138" font-size="10" fill="#2a78d6" font-weight="600" text-anchor="start">Chunk B (Anfang)</text><text x="324" y="156" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">drei Monate zum Monatsende. Die</text><text x="324" y="171" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">Kündigung bedarf der Schriftform. …</text><line x1="299.0" y1="116.0" x2="299.0" y2="180.0" stroke="#eb6834" stroke-width="2"/><text x="299" y="190" font-size="9.5" fill="#a33a12" font-weight="600" text-anchor="middle">Schnitt</text><text x="40" y="208" font-size="11.5" fill="#a33a12" font-weight="500" text-anchor="start">✗  Chunk A nennt die Frist nicht, Chunk B weiß nicht, wovon er redet.</text><text x="55" y="224" font-size="11.5" fill="#a33a12" font-weight="500" text-anchor="start">Beide Vektoren zeigen am Thema vorbei.</text><text x="28" y="246" font-size="13" fill="#17171a" font-weight="600" text-anchor="start">Mit 100 Token Overlap</text><rect x="40.0" y="260.0" width="246.0" height="58.0" rx="4" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.2"/><rect x="40.0" y="260.0" width="246.0" height="58.0" rx="4" fill="none" stroke="#2a78d6" stroke-width="1.2"/><text x="52" y="280" font-size="10" fill="#2a78d6" font-weight="600" text-anchor="start">Chunk A (Ende)</text><text x="52" y="298" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">… Das Mietverhältnis endet durch</text><text x="52" y="313" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">Kündigung. Die Kündigungsfrist beträgt</text><rect x="312.0" y="260.0" width="246.0" height="58.0" rx="4" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.2"/><rect x="319.0" y="286.0" width="164.0" height="17.0" rx="3" fill="#fdf0ea" stroke="#eb6834" stroke-width="1"/><rect x="312.0" y="260.0" width="246.0" height="58.0" rx="4" fill="none" stroke="#2a78d6" stroke-width="1.2"/><text x="324" y="280" font-size="10" fill="#2a78d6" font-weight="600" text-anchor="start">Chunk B (Anfang)</text><text x="324" y="298" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">Die Kündigungsfrist beträgt</text><text x="324" y="313" font-size="11.5" fill="#17171a" font-weight="400" text-anchor="start">drei Monate zum Monatsende. Die Kündigung …</text><text x="319" y="332" font-size="9.5" fill="#a33a12" font-weight="500" text-anchor="start">orange umrandet = wiederholt aus Chunk A</text><text x="40" y="356" font-size="11.5" fill="#0f7a56" font-weight="500" text-anchor="start">✓  Chunk B enthält den ganzen Satz. Jede Passage kommt mindestens</text><text x="55" y="372" font-size="11.5" fill="#0f7a56" font-weight="500" text-anchor="start">einmal vollständig im Index vor.</text><rect x="596.0" y="112.0" width="252.0" height="244.0" rx="6" fill="#ffffff" stroke="#e7e6e1" stroke-width="1"/><text x="612" y="136" font-size="12.5" fill="#17171a" font-weight="600" text-anchor="start">Der Preis</text><text x="612" y="157" font-size="10.8" fill="#82807a" font-weight="400" text-anchor="start">Der Index wächst um den Anteil,</text><text x="612" y="171" font-size="10.8" fill="#82807a" font-weight="400" text-anchor="start">den der Overlap ausmacht.</text><text x="612" y="196" font-size="10.5" fill="#56554f" font-weight="500" text-anchor="start">POC:  100 / 800 Token</text><rect x="612.0" y="204.0" width="190.0" height="12.0" rx="3" fill="#f1f1ee"/><rect x="612.0" y="204.0" width="79.2" height="12.0" rx="3" fill="#2a78d6"/><text x="802" y="227" font-size="10.5" fill="#2a78d6" font-weight="600" text-anchor="end">+12,5 % Index</text><text x="612" y="258" font-size="10.5" fill="#56554f" font-weight="500" text-anchor="start">Microsoft:  128 / 512 Token</text><rect x="612.0" y="266.0" width="190.0" height="12.0" rx="3" fill="#f1f1ee"/><rect x="612.0" y="266.0" width="158.3" height="12.0" rx="3" fill="#eb6834"/><text x="802" y="289" font-size="10.5" fill="#eb6834" font-weight="600" text-anchor="end">+25,0 % Index</text><text x="612" y="332" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="start">Und: derselbe Satz kann zweimal</text><text x="612" y="346" font-size="10.5" fill="#82807a" font-weight="400" text-anchor="start">in der Trefferliste stehen.</text></svg>