<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">MCP-Architektur im Agenten</title><desc id="d">Bedrock, Agent-Anwendung mit MCP-Client und MCP-Server nebeneinander; zwischen Bedrock und MCP-Server besteht keine Verbindung.</desc><rect x="0" y="0" width="880" height="360" fill="#fcfcfb"/><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Wer redet hier eigentlich mit wem?</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Das Modell erreicht den MCP-Server nie. Es formuliert einen Wunsch; ausgeführt wird er woanders.</text><line x1="118" y1="92" x2="748" y2="92" stroke="#d8d7d1" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="118" y1="92" x2="118" y2="112" stroke="#d8d7d1" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="748" y1="92" x2="748" y2="112" stroke="#d8d7d1" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="300" y="81" width="266" height="22" fill="#fcfcfb"/><text x="433" y="96" font-size="11.5" fill="#82807a" font-weight="400" text-anchor="middle">✕  diese Verbindung gibt es nicht</text><rect x="28" y="112" width="180" height="76" rx="8" fill="#ffffff" stroke="#d8d7d1" stroke-width="1.2"/><text x="118.0" y="138" font-size="13.5" fill="#17171a" font-weight="600" text-anchor="middle">Amazon Bedrock</text><text x="118.0" y="157" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="middle">Claude – rechnet, ruft nichts auf</text><rect x="272" y="112" width="252" height="130" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/><text x="398" y="134" font-size="13.5" fill="#17171a" font-weight="600" text-anchor="middle">Agent-Anwendung</text><text x="398" y="151" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="middle">der Host – hier läuft die Schleife</text><rect x="292" y="166" width="212" height="58" rx="6" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1"/><text x="398" y="189" font-size="12.5" fill="#17171a" font-weight="600" text-anchor="middle">MCP-Client</text><text x="398" y="207" font-size="10.5" fill="#56554f" font-weight="400" text-anchor="middle">führt aus, was das Modell wünscht</text><rect x="660" y="112" width="176" height="76" rx="8" fill="#ffffff" stroke="#d8d7d1" stroke-width="1.2"/><text x="748.0" y="138" font-size="13.5" fill="#17171a" font-weight="600" text-anchor="middle">MCP-Server</text><text x="748.0" y="157" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="middle">Tools: run_query, …</text><rect x="660" y="212" width="176" height="66" rx="8" fill="#ffffff" stroke="#d8d7d1" stroke-width="1.2"/><text x="748.0" y="238" font-size="13.5" fill="#17171a" font-weight="600" text-anchor="middle">Amazon Athena</text><text x="748.0" y="257" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="middle">+ S3</text><line x1="748" y1="188" x2="748" y2="205" stroke="#82807a" stroke-width="1.6"/><path d="M743.5,205 L748,212 L752.5,205 Z" fill="#82807a"/><line x1="272" y1="134" x2="215" y2="134" stroke="#2a78d6" stroke-width="1.6"/><path d="M215,129.5 L208,134 L215,138.5 Z" fill="#2a78d6"/><text x="240" y="126" font-size="11" fill="#2a78d6" font-weight="600" text-anchor="middle">①</text><line x1="208" y1="168" x2="265" y2="168" stroke="#eb6834" stroke-width="1.6"/><path d="M265,163.5 L272,168 L265,172.5 Z" fill="#eb6834"/><text x="240" y="186" font-size="11" fill="#eb6834" font-weight="600" text-anchor="middle">②</text><line x1="524" y1="134" x2="653" y2="134" stroke="#82807a" stroke-width="1.6"/><path d="M653,129.5 L660,134 L653,138.5 Z" fill="#82807a"/><text x="592" y="126" font-size="11" fill="#56554f" font-weight="600" text-anchor="middle">③</text><line x1="660" y1="168" x2="531" y2="168" stroke="#82807a" stroke-width="1.6"/><path d="M531,163.5 L524,168 L531,172.5 Z" fill="#82807a"/><text x="592" y="186" font-size="11" fill="#56554f" font-weight="600" text-anchor="middle">④</text><text x="28" y="272" font-size="11" fill="#2a78d6" font-weight="600" text-anchor="start">①</text><text x="46" y="272" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="start">Verlauf + Tool-Definitionen an das Modell</text><text x="28" y="289" font-size="11" fill="#82807a" font-weight="600" text-anchor="start">②</text><text x="46" y="289" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="start">Antwort: tool_use-Blöcke – der Wunsch, keine Daten</text><text x="28" y="306" font-size="11" fill="#82807a" font-weight="600" text-anchor="start">③</text><text x="46" y="306" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="start">MCP-Client ruft das Tool auf (tools/call)</text><text x="28" y="323" font-size="11" fill="#82807a" font-weight="600" text-anchor="start">④</text><text x="46" y="323" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="start">Ergebnis zurück an den Host</text><text x="28" y="340" font-size="11" fill="#2a78d6" font-weight="600" text-anchor="start">⑤</text><text x="46" y="340" font-size="11.5" fill="#56554f" font-weight="400" text-anchor="start">alles von vorn: ein neuer Modellaufruf mit tool_result</text></svg>