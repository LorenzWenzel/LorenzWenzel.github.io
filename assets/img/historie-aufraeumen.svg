<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Was Aufraeumen des Verlaufs bringt</title><desc id="d">Balken: alles behalten 71 Prozent, letzte fuenf Tool-Paare 79 Prozent, zusaetzlich laufende Zusammenfassung 91,6 Prozent.</desc><rect x="0" y="0" width="880" height="330" fill="#fcfcfb"/><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Weniger Verlauf, mehr richtige Antworten</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Erledigte Aufgaben auf einem Benchmark mit 50 Aufgaben. Die Variante, die alles behält, ist die schlechteste –</text><text x="28" y="77" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">und zugleich die teuerste.</text><line x1="294.0" y1="114" x2="294.0" y2="276" stroke="#e7e6e1" stroke-width="1"/><text x="294.0" y="106" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">0 %</text><line x1="398.5" y1="114" x2="398.5" y2="276" stroke="#e7e6e1" stroke-width="1"/><text x="398.5" y="106" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">25 %</text><line x1="503.0" y1="114" x2="503.0" y2="276" stroke="#e7e6e1" stroke-width="1"/><text x="503.0" y="106" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">50 %</text><line x1="607.5" y1="114" x2="607.5" y2="276" stroke="#e7e6e1" stroke-width="1"/><text x="607.5" y="106" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">75 %</text><line x1="712.0" y1="114" x2="712.0" y2="276" stroke="#e7e6e1" stroke-width="1"/><text x="712.0" y="106" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">100 %</text><text x="280" y="146" font-size="13" fill="#17171a" font-weight="400" text-anchor="end">alles behalten</text><rect x="294" y="124" width="296.8" height="32" rx="4" fill="#eb6834"/><text x="602.78" y="146" font-size="13" fill="#17171a" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">71,0 %</text><text x="670.78" y="146" font-size="11.5" fill="#82807a" font-weight="400" text-anchor="start">≈ 3× so viele Token</text><text x="280" y="202" font-size="13" fill="#17171a" font-weight="400" text-anchor="end">nur die letzten fünf Tool-Paare</text><rect x="294" y="180" width="330.2" height="32" rx="4" fill="#2a78d6"/><text x="636.22" y="202" font-size="13" fill="#17171a" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">79,0 %</text><text x="280" y="258" font-size="13" fill="#17171a" font-weight="400" text-anchor="end">dazu eine laufende Zusammenfassung</text><rect x="294" y="236" width="382.9" height="32" rx="4" fill="#2a78d6"/><text x="688.8879999999999" y="258" font-size="13" fill="#17171a" font-weight="600" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">91,6 %</text><text x="280" y="314" font-size="11.5" fill="#82807a" font-weight="400" text-anchor="end">Quelle: 50-Aufgaben-Benchmark aus der Praxis, siehe Text.</text></svg>