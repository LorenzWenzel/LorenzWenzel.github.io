<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 368" width="880" height="368" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Kosten je Nutzerfrage nach Variante</title><desc id="d">Gestapelte Balken: A1 195,24 Dollar, A2 69,24, B 80,80, C 183,50 je 1000 Fragen, aufgeteilt in Cache-Read, Gespraechsverlauf und Ausgabe.</desc><rect x="0" y="0" width="880" height="368" fill="#fcfcfb"/><text x="28" y="38" font-size="18" fill="#17171a" font-weight="600" text-anchor="start">Was eine Nutzerfrage kostet</text><text x="28" y="60" font-size="12.5" fill="#56554f" font-weight="400" text-anchor="start">Dollar je 1 000 Fragen, Claude Sonnet 5 zu Listenpreisen. Prompt Caching in allen Varianten aktiv.</text><rect x="28" y="80" width="11" height="11" rx="2.5" fill="#2a78d6"/><text x="45" y="90" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">Präfix über Cache-Read</text><rect x="286" y="80" width="11" height="11" rx="2.5" fill="#eb6834"/><text x="303" y="90" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">Gesprächsverlauf zum vollen Preis</text><rect x="544" y="80" width="11" height="11" rx="2.5" fill="#1baf7a"/><text x="561" y="90" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">Ausgabe</text><line x1="228.0" y1="122" x2="228.0" y2="324" stroke="#e7e6e1" stroke-width="1"/><text x="228.0" y="114" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">$0</text><line x1="367.0" y1="122" x2="367.0" y2="324" stroke="#e7e6e1" stroke-width="1"/><text x="367.0" y="114" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">$50</text><line x1="506.0" y1="122" x2="506.0" y2="324" stroke="#e7e6e1" stroke-width="1"/><text x="506.0" y="114" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">$100</text><line x1="645.0" y1="122" x2="645.0" y2="324" stroke="#e7e6e1" stroke-width="1"/><text x="645.0"