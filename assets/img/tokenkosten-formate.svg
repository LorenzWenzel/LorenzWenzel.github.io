<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 458" width="860" height="458" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title id="t">Tokenkosten je Tabellenformat</title><desc id="d">Balkendiagramm: Tokenbedarf eines Athena-Resultsets mit 1000 Zeilen in neun Formaten, von XML (75740) bis TSV (23513).</desc><rect x="0" y="0" width="860" height="458" fill="#fcfcfb"/><text x="28" y="40" font-size="19" fill="#17171a" font-weight="600" text-anchor="start">Was ein Athena-Resultset im Kontext kostet</text><text x="28" y="62" font-size="13" fill="#56554f" font-weight="400" text-anchor="start">1 000 Zeilen × 6 Spalten, in neun Serialisierungen. Gemessen mit tiktoken o200k_base.</text><rect x="28" y="78" width="11" height="11" rx="2.5" fill="#eb6834"/><text x="45" y="88" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">wiederholt die Spaltennamen in jeder Zeile</text><rect x="330" y="78" width="11" height="11" rx="2.5" fill="#2a78d6"/><text x="347" y="88" font-size="12" fill="#56554f" font-weight="400" text-anchor="start">nennt die Spalten genau einmal</text><line x1="142.0" y1="124" x2="142.0" y2="424" stroke="#e7e6e1" stroke-width="1"/><text x="142.0" y="116" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">0</text><line x1="292.0" y1="124" x2="292.0" y2="424" stroke="#e7e6e1" stroke-width="1"/><text x="292.0" y="116" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">20k</text><line x1="442.0" y1="124" x2="442.0" y2="424" stroke="#e7e6e1" stroke-width="1"/><text x="442.0" y="116" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">40k</text><line x1="592.0" y1="124" x2="592.0" y2="424" stroke="#e7e6e1" stroke-width="1"/><text x="592.0" y="116" font-size="11" fill="#82807a" font-weight="400" text-anchor="middle">60k</text><line x1="742.0" y1="124" x2="742.0" y2="424" stroke="#e7e6e1" stroke-width="1"/><text x="742.