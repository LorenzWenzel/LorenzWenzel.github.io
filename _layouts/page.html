---
layout: default
---
<article class="post">

  <header class="post-header">
    <h1 class="post-title"><span data-lang-block="de">{{ page.title | escape }}</span><span data-lang-block="en">{{ page.title_en | default: page.title | escape }}</span></h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
