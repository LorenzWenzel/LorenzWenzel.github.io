<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  <script>
    /* Laeuft vor dem ersten Rendern: setzt die Sprachklasse, damit die
       falsche Sprache nie kurz aufblitzt. Die Sichtbarkeit selbst regelt CSS. */
    (function () {
      try {
        if (localStorage.getItem('blog-lang') === 'en') {
          document.documentElement.className += ' lang-en';
          document.documentElement.lang = 'en';
        }
      } catch (e) {}
    })();
  </script>
</head>
